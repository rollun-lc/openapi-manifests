openapi: 3.0.0
info:
  version: "1"
  title: "SuppliersOrdersCreation"
  description: Long task suppliers order creation. With this manifest, you can create an order creation task and track its state.
servers:
  - url: http://suppliers/openapi/SuppliersOrdersCreation/v1
tags:
  - name: OrderCreationTasks
paths:
  "/orderCreationTasks":
    post:
      description: >
        Create task. Multiple requests with same idempotency key does not create new task, but return same task.
        If task rejected (due to validation error or other reason) new task with new id will be created.
      tags:
        - OrderCreationTasks
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationTaskInfoResult'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrerationTaskPostRequest'
    get:
      tags:
        - OrderCreationTasks
      summary: "Get list of tasks"
      parameters:
        - name: payloadIdempotencyKey
          in: query
          description: Filtering by payload.idempotencyKey
          required: false
          schema:
            type: string
            example: '12345'
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationTaskInfoListResult"
        '500':
          description: "Internal error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              
  "/orderCreationTasks/{id}":
    get:
      tags:
        - OrderCreationTasks
      summary: 'Get info about task state'
      parameters:
        - in: path
          name: id
          description: Id of task
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationTaskInfoResult'
        "500":
          description: 'Some internal error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
components:
  schemas:
    # Basic results components
    ErrorResult:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      description: "Message field is not required"
    Message:
      type: object
      properties:
        level:
          type: string
          enum:
            - emergency
            - alert
            - critical
            - error
            - warning
            - notice
            - info
        type:
          type: string
          enum:
            - UNDEFINED
            - INVALID_RESPONSE
            - SERVICE_UNAVAILABLE
          description: >
            You can expose this enum for all your errors
            UNDEFINED - Any undefined message type
            INVALID_RESPONSE - A message generated by the client stating that the response could not be decoded
            SERVICE_UNAVAILABLE - The order creation tasks service cannot handle the request right now; retry later
        text:
          type: string
          description: Message, that describes what went wrong
    SuccessResult:
      allOf:
        - $ref: '#/components/schemas/ErrorResult'
      type: object
      properties:
        data:
          type: object
          
    CreationTaskInfoListResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResult'
      type: object
      properties:
        data:
          type: array
          items: 
            $ref: '#/components/schemas/CreationTaskInfo'
    
    CreationTaskInfoResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResult'
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreationTaskInfo'
          
    
    CrerationTaskPostRequest:
      type: object
      required:
        - payload
      properties:
        payload:
          $ref: '#/components/schemas/CrerationTaskPayload'
          
    CreationTaskInfo:
      type: object
      required:
        - id
        - stage
        - status
      properties:
        id:
          type: string
          description: >
            Server generated unique value. 
            Cannot be equals to idempotency_key, since there can be several rejected tasks with same idempotency_key.
          example: '12345'
        stage:
          $ref: '#/components/schemas/Stage'
        status:
          $ref: '#/components/schemas/Status'
        payload:
          $ref: '#/components/schemas/CrerationTaskPayload'
        result:
          $ref: '#/components/schemas/CreationTaskResult'
        createdAt:
          type: string
          format: date-time
          description: >
            Time the task was created, in UTC, strictly YYYY-MM-DDTHH:MM:SS.uuuuuuZ (microseconds, zone Z).
            Lets the client pick the latest task among several tasks with the same idempotency key.
          example: '2026-09-27T14:05:00.123456Z'

    Stage:
      type: object
      required:
        - value
        - all
      properties:
        value:
          type: string
          description: 'Current stage'
          example: 'creating'
        all:
          type: array
          description: 'All possible stages'
          items:
            type: string
          example: [ 'creating', 'done' ]
    
    Status:
      type: object
      required:
        - value
        - all
      properties:
        value:
          type: string
          description: 'Current state'
          example: 'pending'
        all:
          type: array
          description: 'All possible states'
          items:
            type: string
          example: [ 'pending', 'in_progress', 'fulfilled', 'rejected' ]
          
    CrerationTaskPayload:
      type: object
      required:
        - idempotencyKey
        - supplierCode
        - shippingMethodName
        - items
      properties:
        idempotencyKey:
          type: string
          example: '54321'
          description: An idempotency key is a unique value generated by the client to not duplicate orders. Multiple requests with same idempotency key create order only once.
        supplierCode:
          type: string
          description: >
            Supplier code, exactly as the supplier is named in service-suppliers (e.g. 'PartsUnlimited', 'Wps', 'Turn14').
            A supplier that is not connected to the purchase tasks (the list ORDER_CREATION_TASK_SUPPLIERS of
            service-suppliers) is refused with UNSUPPORTED_REQUEST.
        shippingMethodName:
          type: string
          description: >
            Supplier shipping method name
            Pickup - for pickup of orders. In this case, you do not need to define a recipient, but a warehouse is required for each item.
            Any other value for dropship orders. Ex. "USPS First-Class Mail" or "FedEx 2Day"
            Order to our own warehouse: 'UPS Ground' together with receiver.address.address1 = 'Dealer Address'
            gives an order to the address of our dealer account instead of a dropship one, for any supplier
            connected to the purchase tasks (PartsUnlimited - a REGULAR order in pu-orders; Wps - a cart
            without ship_* and ship_via, so the supplier takes the address and the shipping method from the
            account; Turn14 - a quote from the location default and an order from it, POST /v1/order/from_quote,
            to the full address of the account from the config of service-suppliers with is_shop_address true,
            the cheapest allowed ground method of every warehouse part); neither the address nor the shipping
            method of the task is sent to the supplier. See receiver.
        receiver:
          allOf:
            - $ref: '#/components/schemas/Customer'
          description: >
            Order recipient.
            Order to our own warehouse: address1 = 'Dealer Address' together with shippingMethodName 'UPS Ground'
            (see shippingMethodName); this address is not sent to the supplier (Turn14 gets the address and
            the name of our account from the config of service-suppliers).
        items:
          type: array
          description: List of items to order
          items:
            $ref: '#/components/schemas/Item'
            
    CreationTaskResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResult'
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrderNumber'
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CreationTaskResultMessage"
          
    OrderNumber:
      type: object
      properties:
        orderId:
          type: string
          description: >
            Id of the supplier order: '<Supplier> | <order number of the supplier>', not the PO.
            Wps - the common 8-digit WPS order number without the warehouse suffix (-000, -050, -100);
            when several orders are found under the PO - the smallest one, with an ORIGINAL_ORDER_KNOWN_PROBLEM message.
          example: 'Autodist | AU431'
          
    CreationTaskResultMessage:
      type: object
      properties:
        level:
          type: string
          enum:
            - emergency
            - alert
            - critical
            - error
            - warning
            - notice
            - info
        type:
          type: string
          enum:
            - UNDEFINED
            - IDEMPOTENT_PARAMETER_MISMATCH
            - CSN_BY_RID_NOT_FOUND
            - UNKNOWN_SHIPPING_METHOD
            - UNAVAILABLE_SHIPPING_METHOD
            - ITEM_SHIPPING_RESTRICTED
            - INVALID_ADDRESS
            - UNSUPPORTED_REQUEST
            - SERVICE_UNAVAILABLE
            - ITEMS_NOT_AVAILABLE
            - ALREADY_EXIST
            - TASK_EXPIRED
            - RECEIVER_MISMATCH
            - SHIPPING_METHOD_MISMATCH
            - PRICES_MISMATCH
            - ITEMS_MISMATCH
            - UNPARSED_ADDRESS_FIELD
            - RID_BY_CSN_NOT_FOUND
            - ORIGINAL_ORDER_KNOWN_PROBLEM
            - ORDER_NOT_SUBMITTED
          description: >
            UNDEFINED - Any undefined message type
            IDEMPOTENT_PARAMETER_MISMATCH - Order with same idempotency_key already exist but with different parameters
            CSN_BY_RID_NOT_FOUND - Cannot convert rid to csn.
            UNKNOWN_SHIPPING_METHOD - The selected supplier does not have this shipping method (or needs to be added)
            UNAVAILABLE_SHIPPING_METHOD - A shipping method exists but is not available for this order
            ITEM_SHIPPING_RESTRICTED - This item cannot be shipped for various reasons
            INVALID_ADDRESS - Shipping address isn't valid
            UNSUPPORTED_REQUEST - The request is correct but currently not supported
            SERVICE_UNAVAILABLE - The supplier or its service did not answer; it is unknown whether the order was created
            ITEMS_NOT_AVAILABLE - The supplier has no single warehouse with the full quantity for at least one item; the order was not created
            ALREADY_EXIST - The supplier already has an order or an unfinished cart with this idempotency key (PO); no new order was created
            TASK_EXPIRED - The task waited in the queue longer than allowed and was closed without creating an order
            RECEIVER_MISMATCH - The order was created, but its receiver differs from the requested one (expected for 'Dealer Address' orders)
            SHIPPING_METHOD_MISMATCH - The order was created, but its shipping method differs from the requested one
            PRICES_MISMATCH - The order was created, but its item prices differ from the expected ones
            ITEMS_MISMATCH - The order was created, but its items differ from the requested ones
            UNPARSED_ADDRESS_FIELD - The order was created, but a field of its address could not be parsed
            RID_BY_CSN_NOT_FOUND - The order was created, but the rid of one of its items could not be found by csn
            ORIGINAL_ORDER_KNOWN_PROBLEM - The order was created; its raw supplier data has a known problem,
            or the order exists but is unclear (several supplier orders under one PO, or the order number is known
            but the order could not be read); the task is fulfilled with orderId, the text says what to check on the
            supplier site
            ORDER_NOT_SUBMITTED - This task placed no order: before the call that buys (Wps - POST /orders, Turn14 -
            POST /v1/order/from_quote) the supplier refused, failed or did not answer (including the search by PO
            that did not answer "no such PO", an unavailable rid to part number mapping and the checks of the Turn14
            quote - warehouse, shipping method, shipping limit), or after that call: Wps returned no order number and
            no order was found by the PO; Turn14 refused explicitly (HTTP 4xx with errors, 429 included) and the
            search by the PO found no order. Anything else unclear after the call of Turn14 is SERVICE_UNAVAILABLE:
            its search by the PO shows a new order late. The task is rejected, the message has level error and comes
            first. A retry (a new task with the same key) is safe: every task of a supplier that allows a repeated PO
            first searches the order by the PO. Unlike SERVICE_UNAVAILABLE, which leaves the task in_progress because
            the order may have been bought.
        text:
          type: string
          description: Message, that describes what went wrong
    
    Item:
      type: object
      required:
        - rid
        - quantity
      properties:
        rid:
          type: string
          description: Rollun Id
          example: VW6A4
        quantity:
          type: integer
          description: Quantity of products
          example: 2
        warehouse:
          type: string
          nullable: true
          description: >
            The name of the warehouse from where you want to send the goods. Specific for each supplier.
            If no warehouse has been specified, then the supplier can choose the appropriate one, depending on its distance to the client and the availability of items.
            If a warehouse is specified, then the supplier must send from it, or report an error, why he cannot do this
            Required for pickup orders.
            TuckerRocky - ['TX']
            Wps - not sent: WPS chooses the warehouse and may split the order between warehouses.
            PartsUnlimited - ['NC']
    Customer:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
          description: Full name
          example: Shawn Weisweaver
        phone:
          type: string
          nullable: true
          description: Phone number to reach the person
          example: "415-123-4567"
        email:
          type: string
          nullable: true
          description: Email address to reach the person
          example: "test@mail.loc"
        address:
          $ref: "#/components/schemas/Address"
    Address:
      type: object
      required:
        - country
        - state
        - city
        - postalCode
        - address1
      properties:
        country:
          type: string
          description: "Country code"
        state:
          type: string
          description: US state code
          example: CA
        city:
          type: string
          description: Full city name
          example: San Francisco
        postalCode:
          type: string
          description: ZIP or postal code
          example: "94104"
        address1:
          type: string
          description: First line of the address
          example: "417 Montgomery St"
        address2:
          type: string
          nullable: true
          description: Second line of the address
          example: "Floor 5"