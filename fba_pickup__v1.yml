  "/fbaSrOrders/{id}/itemLabels/workflowFile":
    post:
      tags:
        - ItemLabels
      # operationId обязателен здесь по той же причине, что и у /itemLabels:
      # без него имя действия выводится из пути и метода, а после отсечения
      # имени тега (ItemLabels) от выведенного имени остаётся кусок, который
      # генератор волен схлопнуть и увести в generic-метод Rest-объекта.
      # Заданное явно имя доезжает до контроллера как есть.
      operationId: fbaSrOrdersIdItemLabelsWorkflowFilePost
      description: "ВТОРОЙ путь к тем же наклейкам по заказу приёмки — не замена
                    печати через SP-API, а её сосед. Отдаёт заготовку Amazon
                    Create workflow template: человек грузит файл в Send to Amazon,
                    там создаётся технический STA workflow, и FNSKU-этикетки он
                    скачивает уже оттуда. Нужен, когда Amazon не отдал PDF,
                    когда ссылка на 29 секунд не успевает дожить до принтера,
                    либо когда наклейки надо получить вместе с самим workflow.
                    Читает и резолвит РОВНО ТО ЖЕ, что и печать: те же строки
                    заказа с количеством > 0, тот же резолв RID -> MLN, та же
                    раскладка по всем строкам с кодами причин. Различается
                    только артефакт: там url на PDF, здесь fileName плюс
                    fileContent — сам файл текстом.
                    Ручка READ-ONLY и ОФФЛАЙН: Amazon не зовётся вовсе — ни SP-API,
                    ни amz-orders. Отсюда у неё физически не бывает трёх стопов
                    печати: amazon_labels_unavailable (звать некого),
                    too_many_items и mln_quantity_over_limit (у формата файла
                    нет ни потолка строк, ни потолка количества — они чужие,
                    из операции SP-API, и к файлу отношения не имеют).
                    Лимиты у файла ДРУГИЕ, и это главная ловушка соседства:
                    Merchant SKU в шаблоне до 80 символов против 40 у msku
                    в SP-API. Листинг с длинным MLN, который печать выбрасывает,
                    файл принимает.
                    Формат файла — tab-delimited .txt: это второй из ровно двух
                    форматов, которые Amazon называет в инструкции к шаблону
                    (лист Instructions, шаг 4). CSV в том списке НЕТ."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id заказа поставщику (сделка FbaSrOrder)"
          example: "719944"
      responses:
        "200":
          description: "Файл текстом и полная раскладка по строкам заказа.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: order_not_found (заказа с таким Id в CRM
                        нет вовсе либо Id нечисловой),
                        order_has_no_received_items (заказ ЕСТЬ, но ни одной
                        строки с количеством больше нуля),
                        order_source_unavailable (не ответила НАША база),
                        inventory_unavailable (fba-inventory не ответил либо мог
                        усечь список кандидатов),
                        nothing_to_print (ни одна строка заказа не резолвилась
                        в MLN — файл из нуля строк собрать нельзя).
                        amazon_labels_unavailable, too_many_items
                        и mln_quantity_over_limit здесь НЕ БЫВАЮТ: Amazon
                        не зовётся, а потолки строк и количества принадлежат
                        операции SP-API, а не формату файла.
                        При стопе data, как правило, отсутствует. ИСКЛЮЧЕНИЕ —
                        nothing_to_print: там data ЕСТЬ и несёт lines с причиной
                        по каждой строке, но fileName и fileContent
                        отсутствуют — собирать файл не из чего."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря у этой ручки здесь нет:
                        она read-only, личность ей не нужна, а всё, что может
                        пойти не так снаружи, уже разобрано кодами 200. Сюда
                        приходит только непредвиденное исключение
                        со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/itemLabels/workflowFile":
    post:
      tags:
        - ItemLabels
      # operationId обязателен здесь по той же причине, что и у /itemLabels.
      operationId: itemLabelsWorkflowFilePost
      description: "Выгрузка Create workflow template по готовому списку: FNSKU
                    (либо сразу MLN) с количествами, без всякого заказа. Сосед
                    печати по списку, ровно как ручка по заказу — сосед печати
                    по заказу: тот же вход, та же раскладка, тот же резолв,
                    другой артефакт.
                    Тот же вход добивает строки, не резолвнувшиеся по заказу:
                    менеджер выбрал листинг глазами — и кладёт его в файл.
                    Неизвестный FNSKU останавливает ВЕСЬ запрос: файла не будет
                    вовсе. Отдать девять строк из десяти и промолчать про
                    десятую хуже, чем не отдать ничего, — это опечатка, и человек
                    должен её увидеть до того, как загрузит файл в Amazon.
                    Ручка READ-ONLY и ОФФЛАЙН: Amazon не зовётся вовсе.
                    Формат файла — tab-delimited .txt, лимиты формата, а не
                    SP-API: Merchant SKU до 80 символов, количество без потолка,
                    строк без потолка.
                    Каждый листинг обязан встретиться в файле РОВНО ОДИН РАЗ,
                    и это требование шаблона, а не удобство: без case pack Amazon
                    допускает единственную строку на Merchant SKU. Строки,
                    сошедшиеся к одному MLN, схлопываются с суммой количеств —
                    так же, как перед запросом к SP-API."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemLabelsRequest'
      responses:
        "200":
          description: "Файл текстом и раскладка по присланным строкам.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: empty_items (items пуст либо поля нет),
                        invalid_quantity (quantity отсутствует либо <= 0),
                        invalid_line (в строке пусто и fnsku, и mln — либо,
                        наоборот, заполнены обе; сюда же попадает непригодный
                        идентификатор — длиннее 40 символов либо с символом вне
                        [A-Za-z0-9._-]: такая строка уезжает в RQL-выражение
                        in(fnsku,(...)) к чужому сервису),
                        fnsku_not_found: <fnsku> (такого FNSKU в инвентаре нет;
                        код несёт сам FNSKU после двоеточия),
                        mln_ambiguous: <fnsku> (в норме недостижим — FNSKU
                        не бывает больше одного на MLN),
                        inventory_unavailable,
                        nothing_to_print (в норме недостижим: каждая строка
                        списка уже проверена — ветка держит инвариант
                        «файла из нуля строк не бывает»).
                        Потолок длины идентификатора на ВХОДЕ остаётся 40
                        символов и у этой ручки, хотя формат допускает 80:
                        поле руками заполняет человек, а 40 — потолок msku,
                        по которому в проде не набралось и трети (реальный
                        максимум 12 у mln, 10 у fnsku). Восемьдесят символов
                        достижимы только со стороны инвентаря, где строку
                        пишет не человек.
                        too_many_items, mln_quantity_over_limit
                        и amazon_labels_unavailable здесь НЕ БЫВАЮТ: потолки
                        принадлежат операции SP-API, а Amazon не зовётся.
                        При этом data ЕСТЬ у стопов, разбирающих строки, —
                        fnsku_not_found, mln_ambiguous и nothing_to_print: код
                        в messages[0] назовёт ПЕРВУЮ сломанную строку, а раскладка
                        пометит ВСЕ. У остальных (empty_items, invalid_quantity,
                        invalid_line, inventory_unavailable) разбирать нечего
                        и data нет."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря здесь нет по той же
                        причине, что и у выгрузки по заказу: ручка read-only
                        и личности не требует. Сюда приходит только непредвиденное
                        исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaShipments/{id}/itemLabels":
    post:
      tags:
        - ItemLabels
      # operationId обязателен здесь по той же причине, что и у /itemLabels.
      operationId: fbaShipmentsIdItemLabelsPost
      description: "Печать наклеек FNSKU по Отправке: всё, что лежит по её
                    коробкам, — одним PDF. Третья лестница входа из четырёх;
                    требование карточки — «додати можливість створення лейбл
                    воркфлоу для товарів з айді угоди будь-якої з цих схем».
                    Тип сделки задан ПУТЁМ, а не угадывается по номеру. Номера
                    трёх схем берутся из одной сквозной последовательности CRM
                    и не пересекаются ни разу, так что угадать было бы можно, —
                    но ошибка в цифре тогда напечатала бы наклейки чужой сделки
                    вместо отказа.
                    Наклейки клеят ДО упаковки, поэтому печать по Отправке —
                    заведомо ПОВТОР: этикетка отклеилась, коробку вскрыли
                    и переупаковали, приёмка была месяц назад и её номера никто
                    не помнит, а номер Отправки лежит перед человеком. Повтор
                    безопасен по построению: ручка read-only, журнала
                    напечатанного нет.
                    Состав читается вьюхой, свёрнутой по паре (Отправка, FNSKU):
                    десять коробок с одним товаром дают ОДНУ строку с суммой.
                    Сворачивать по RID при этом нельзя — один RID уезжает
                    в одной Отправке под двумя разными FNSKU, это две наклейки.
                    Позиция С FNSKU (так её пишет карточка коробки в CRM)
                    резолвится однозначно: FNSKU не бывает больше одного на MLN.
                    Позиция БЕЗ FNSKU (так её пишет закрытие коробки в PACK)
                    резолвится по RID и печатается сама, только если листинг
                    у RID единственный — с учётом ВСЕЙ истории FNSKU товара
                    в CRM и при любом его статусе. FNSKU истории, которому
                    листинга в инвентаре нет, тоже считается возможной
                    наклейкой: напечатать его нельзя, но и сам свой листинг
                    рядом с ним не берётся. Несколько листингов — строка mln_ambiguous
                    со всеми кандидатами, включая неактивные, и в PDF она
                    не идёт. Статусные правила заказа здесь не действуют: они
                    выбирают листинг по сегодняшнему статусу, а наклейка
                    на упакованном товаре выбрана раньше."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Отправки (сделка FbaShipment)"
          example: "718435"
      responses:
        "200":
          description: "Ссылка на PDF и полная раскладка по строкам Отправки.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: shipment_not_found (Отправки с таким Id
                        в CRM нет вовсе либо Id нечисловой),
                        shipment_has_no_packed_items (Отправка ЕСТЬ, но
                        упакованного по ней нет — коробки ещё не закрыты либо
                        их нет вовсе; состав пишется при закрытии коробки),
                        deal_source_unavailable (не ответила НАША база: вьюха
                        упаковки, чтение самой сделки либо история FNSKU товара
                        для позиций без FNSKU — без неё листинг не выбирается
                        сам, а запрос останавливается),
                        inventory_unavailable (fba-inventory не ответил: шаблон
                        и SP-API принимают Merchant SKU, а не FNSKU, поэтому
                        за листингом идём туда обе ручки),
                        amazon_labels_unavailable, nothing_to_print,
                        too_many_items.
                        order_not_found и order_has_no_received_items у этой
                        ручки не бывают: заказа приёмки она не читает вовсе.
                        При стопе data, как правило, отсутствует. ИСКЛЮЧЕНИЯ —
                        nothing_to_print и too_many_items: там data ЕСТЬ
                        и несёт lines с причиной по каждой строке."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря здесь нет: ручка
                        read-only, личность ей не нужна. Сюда приходит только
                        непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaShipments/{id}/itemLabels/workflowFile":
    post:
      tags:
        - ItemLabels
      operationId: fbaShipmentsIdItemLabelsWorkflowFilePost
      description: "Выгрузка Create workflow по Отправке. Из всех входов этот
                    ближе всего к смыслу самого файла: Create workflow описывает
                    «вот это я шлю на Amazon», а Отправка ровно это и есть.
                    Читает и резолвит РОВНО ТО ЖЕ, что и печать по Отправке,
                    тем же кодом; различается артефакт и границы плана.
                    Amazon не зовётся: ни SP-API, ни amz-orders. Отсюда
                    amazon_labels_unavailable, too_many_items
                    и mln_quantity_over_limit здесь НЕ БЫВАЮТ. В fba-inventory
                    ручка всё же ходит — шаблон принимает Merchant SKU,
                    а не FNSKU, и это записано в самой карточке.
                    Любая строка, не попавшая в файл, останавливает его
                    целиком: в messages[0] — причина по первой такой строке,
                    'mln_ambiguous: <RID>' (у RID несколько листингов),
                    'mln_not_found: <RID>' (листинга нет у позиции без FNSKU)
                    либо 'fnsku_not_found: <FNSKU>' (FNSKU позиции не знает
                    инвентарь), в data — раскладка, файла нет. Не годится
                    ни одна строка — nothing_to_print, как и раньше. Файл
                    описывает всю отправку, и строка, которой в нём нет,
                    на Amazon не едет."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Отправки (сделка FbaShipment)"
          example: "718435"
      responses:
        "200":
          description: "Файл текстом и полная раскладка по строкам Отправки.
                        Стопы те же, что у печати по Отправке, минус три
                        недостижимых: shipment_not_found,
                        shipment_has_no_packed_items, deal_source_unavailable,
                        inventory_unavailable, nothing_to_print.
                        При nothing_to_print data ЕСТЬ, но fileName
                        и fileContent отсутствуют — файл из нуля строк собрать
                        нельзя, а шапка без данных создала бы в Send to Amazon
                        пустой workflow."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря здесь нет. Сюда приходит
                        только непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaParcels/{id}/itemLabels":
    post:
      tags:
        - ItemLabels
      operationId: fbaParcelsIdItemLabelsPost
      description: "Печать наклеек FNSKU по одной Коробке отправки: только её
                    содержимое. Четвёртая лестница входа и самая узкая —
                    печатают по ней тогда, когда переклеивают одну вскрытую
                    коробку, а не всю Отправку.
                    Устроена как печать по Отправке во всём, кроме объёма:
                    тот же резолв (FNSKU -> MLN, а без FNSKU — по RID), та же раскладка,
                    те же коды. Состав коробки пишется при её закрытии
                    (1041 Parcel filling -> 1042 Measured), поэтому у коробки,
                    которую ещё наполняют, позиций нет и печатать по ней нечего."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Коробки отправки (сделка FbaParcel)"
          example: "722881"
      responses:
        "200":
          description: "Ссылка на PDF и раскладка по строкам Коробки.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: parcel_not_found (Коробки отправки
                        с таким Id в CRM нет вовсе либо Id нечисловой),
                        parcel_has_no_packed_items (Коробка ЕСТЬ, но состав
                        по ней не записан — её ещё наполняют, состав ложится
                        при закрытии),
                        deal_source_unavailable, inventory_unavailable,
                        amazon_labels_unavailable, nothing_to_print,
                        too_many_items.
                        При nothing_to_print и too_many_items data ЕСТЬ
                        и несёт lines с причиной по каждой строке."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря здесь нет. Сюда приходит
                        только непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaParcels/{id}/itemLabels/workflowFile":
    post:
      tags:
        - ItemLabels
      operationId: fbaParcelsIdItemLabelsWorkflowFilePost
      description: "Выгрузка Create workflow по одной Коробке отправки.
                    Тот же вход, что и у печати по Коробке; различается
                    артефакт и границы плана. Amazon не зовётся вовсе, отсюда
                    amazon_labels_unavailable, too_many_items
                    и mln_quantity_over_limit здесь НЕ БЫВАЮТ. Строка,
                    не попавшая в файл, останавливает его так же, как
                    у Отправки, теми же кодами: раскладка есть, файла нет."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Коробки отправки (сделка FbaParcel)"
          example: "722881"
      responses:
        "200":
          description: "Файл текстом и раскладка по строкам Коробки.
                        Стопы: parcel_not_found, parcel_has_no_packed_items,
                        deal_source_unavailable, inventory_unavailable,
                        nothing_to_print.
                        При nothing_to_print data ЕСТЬ, но fileName
                        и fileContent отсутствуют."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря здесь нет. Сюда приходит
                        только непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ## General — по образцу crm_event_handler__v1.yml
    Message:
      type: object
      properties:
        level:
          type: string
          enum:
            - emergency
            - alert
            - critical
            - error
            - warning
            - notice
            - info
        text:
          type: string
          description: "Машиночитаемый код стопа либо текст ошибки.
                        Канонический словарь кодов: item_not_in_order, more_than_left,
                        box_not_receivable, box_not_found, box_already_closed,
                        order_has_open_boxes, order_not_found.
                        Восьмой код словаря — cannot_identify_item — чисто клиентский:
                        до сервера не доходит, приложение логирует его само.
                        Вторая версия добавляет девять кодов стопов упаковки:
                        not_enough_on_shelf, shipment_not_open, shipment_not_found,
                        shipment_already_open, shipment_full, parcel_locked,
                        parcel_not_found, measurements_required, reason_required.
                        И пять кодов 500, которых словарь выше не перечислял:
                        warehouse_not_resolved и empty_items — новые,
                        duplicate_rid, invalid_qty и origin_offer_not_found
                        унаследованы от complete первой версии. Шестой код 500,
                        employee_not_resolved, общий с обеими версиями и не меняется.
                        Из девяти кодов упаковки shipment_already_open на экран
                        исключения не выходит вовсе — для приложения это успех;
                        measurements_required и reason_required экран не допускает
                        раньше, но сервер проверяет их всё равно.
                        Closing a shipment (POST /fbaShipments/{id}/close) adds two
                        packing stops: shipment_empty and shipment_has_open_boxes.
                        Печать этикеток FNSKU добавляет ТРИНАДЦАТЬ кодов, и они
                        делятся надвое по месту, где едут.
                        Девять — стопы всей команды, в messages[].text при 200:
                        order_has_no_received_items (заказ есть, но ни одной
                        строки с количеством больше нуля — количеством считается
                        большее из QtyOrdered и QtyReceived), order_source_unavailable
                        (не ответила НАША база — вьюха заказа либо чтение заказа;
                        собственная недоступная база это предвиденный отказ,
                        и голым HTTP 500 он приходить не должен),
                        nothing_to_print (ни одна строка заказа не резолвилась
                        в MLN), inventory_unavailable (fba-inventory не ответил
                        либо отдал столько строк, что список кандидатов мог быть
                        усечён; Amazon при этом не зовём — без полных кандидатов
                        печатать нечего), amazon_labels_unavailable (amz-orders
                        не ответил либо ответил не 200), fnsku_not_found (FNSKU
                        ручного списка нет в инвентаре; останавливает ВЕСЬ запрос —
                        печатать девять строк из десяти и молчать про десятую хуже,
                        чем не печатать), invalid_quantity (quantity отсутствует
                        либо <= 0), invalid_line (в строке списка пусто и fnsku,
                        и mln, либо заполнены обе, либо идентификатор непригоден),
                        too_many_items (СХЛОПНУТЫХ строк больше 100 — потолок
                        mskuQuantities у Amazon).
                        order_not_found и empty_items у печати НЕ новые: коды взяты
                        из словаря выше и означают ровно то же самое.
                        Ещё четыре — ПОСТРОЧНЫЕ: их место в data.lines[].code,
                        и запрос они не останавливают: mln_ambiguous (у RID
                        несколько кандидатов MLN, выбирает человек — строка
                        возвращается со списком кандидатов и в PDF не идёт),
                        mln_not_found (RID вне инвентаря либо у найденной строки
                        нет пригодного mln, в PDF не идёт), mln_inactive_used
                        (активных MLN нет, но нашёлся ровно один любой — печатаем
                        его, это предупреждение, а не отказ),
                        mln_quantity_over_limit (на листинг вышло больше 10000
                        этикеток — потолок quantity у Amazon, достижимый суммой).
                        ИСКЛЮЧЕНИЕ по месту: у РУЧНОГО СПИСКА mln_ambiguous
                        и mln_quantity_over_limit приезжают ещё и в messages[0]
                        и запрос останавливают. Причина в том, что частичная
                        печать по списку недопустима вовсе: сломанная строка
                        отменяет весь запрос, и код обязан быть там, где клиент
                        ищет причину отказа. В data.lines[] они при этом остаются
                        тоже — с пометкой на КАЖДОЙ сломанной строке.
                        Так же отказывает выгрузка Create workflow по Отправке
                        и по Коробке — при ЛЮБОЙ строке, не попавшей в файл:
                        'mln_ambiguous: <RID>', 'mln_not_found: <RID>' либо
                        'fnsku_not_found: <FNSKU>' по первой такой строке,
                        раскладка в data, файла нет.
                        ДВЕ ФОРМЫ ДЕТАЛИ, обе намеренные, и клиент обязан знать
                        про обе.
                        Первая — ЗНАЧЕНИЕ через двоеточие в первом же сообщении:
                        'fnsku_not_found: X001LOD5KR', 'mln_ambiguous: X001LOD5KR',
                        'mln_quantity_over_limit: 2N-BCI2-K3LK'. Так едет то, что
                        разбирается машинально и указывает на конкретную строку
                        запроса: код до двоеточия, значение после.
                        Вторая — ЧУЖОЙ ТЕКСТ отдельным ВТОРЫМ сообщением:
                        messages[0].text это amazon_labels_unavailable, а
                        messages[1].text — то, что сказал amz-orders, свободной
                        строкой на его языке (amazon_error, amazon_throttled,
                        no_document_returned и прочее). Код нужен приложению,
                        текст — дежурному, и склеивать их в одну строку нельзя:
                        приложение лишилось бы машиночитаемой причины.
                        Uq0J6Z1I adds one packing stop, shipment_of_other_warehouse: «+ NEW BOX»
                        (POST /fbaShipments/{id}/parcels), «BOX READY» (POST /fbaParcels/{id}/close)
                        and «FINISH PACKING» (POST /fbaShipments/{id}/close) on a shipment of another
                        warehouse than the signed-in employee's. The same three commands now refuse an
                        employee outside the warehouse map with the 500 warehouse_not_resolved."
    ErrorResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      description: "Message field is not required"
    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      required:
        - data
      properties:
        data:
          type: object

    ## Custom responses
    BoxResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Успех — data с состоянием коробки.
                    При бизнес-стопе (messages[].level = error) data, как правило,
                    отсутствует. Исключение — box_already_closed: там data содержит
                    фактическое состояние коробки, чтобы приложение показало,
                    что именно уже записано."
      properties:
        data:
          $ref: '#/components/schemas/BoxState'

    OrderSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Успех — data с итогом по заказу.
                    При бизнес-стопе (messages[].level = error) data отсутствует."
      properties:
        data:
          $ref: '#/components/schemas/OrderSummary'

    CurrentEmployeeResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Success — data with the signed-in employee and their warehouse.
                    On a refusal the read answers HTTP 500 with employee_not_resolved
                    or warehouse_not_resolved and has no data."
      properties:
        data:
          $ref: '#/components/schemas/CurrentEmployee'

    CurrentEmployee:
      type: object
      description: "The signed-in employee and the warehouse the app works on for them."
      required:
        - id
        - name
        - warehouse
      properties:
        id:
          type: string
          description: "employees.Id of the signed-in person."
        name:
          type: string
          description: "employees.Name; empty when the row has none."
        warehouse:
          type: string
          enum:
            - pickup_cn
            - pickup_ut
          description: "The warehouse of the employee: the receiving queue, the shelf
                        and the open shipment are read for it."

    ShipmentResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Успех — data с состоянием Отправки.
                    При бизнес-стопе (messages[].level = error) data, как правило,
                    отсутствует. Исключение — shipment_already_open: там data несёт
                    состояние УЖЕ ОТКРЫТОЙ Отправки с alreadyOpen = true, чтобы
                    приложение просто открыло её вместо новой."
      properties:
        data:
          $ref: '#/components/schemas/ShipmentState'

    ParcelResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Успех — data с состоянием Коробки отправки.
                    При бизнес-стопе (messages[].level = error) data, как правило,
                    отсутствует. Исключение — повторное закрытие своей коробки:
                    там data содержит фактически записанное состояние
                    с alreadyClosed = true.
                    shipment едет рядом с data у команд, которые пикапер вызывает
                    с экрана Отправки (создание коробки и закрытие), — чтобы экран
                    перерисовался целиком одним ответом, без второго запроса
                    за шапкой. Создание коробки меняет parcelsCount, закрытие —
                    статус коробки в списке; и то и другое видно на одном экране.
                    Потолок приходит там же, с данными Отправки: зашивать десятку
                    в клиент нельзя.
                    У reopen shipment не едет: это команда помощника менеджера,
                    экрана Отправки за ней нет."
      properties:
        data:
          $ref: '#/components/schemas/ParcelState'
        shipment:
          $ref: '#/components/schemas/ShipmentState'

    ItemLabelsResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Успех — data со ссылкой на PDF и полной раскладкой по строкам.
                    При бизнес-стопе (messages[].level = error) data, как правило,
                    отсутствует. Исключения — стопы, при которых человеку нужна
                    именно раскладка, чтобы сделать следующий шаг: nothing_to_print
                    (ни одна строка не резолвилась), too_many_items (схлопнутых
                    строк больше сотни — разбивать будет человек, и без раскладки
                    он не знает, по какой границе резать) и разбор сломанных строк
                    ручного списка (fnsku_not_found, mln_ambiguous,
                    mln_quantity_over_limit), и отказ выгрузки по Отправке
                    и Коробке (mln_ambiguous, mln_not_found, fnsku_not_found).
                    У всех у них url отсутствует:
                    печатать было нечего, и выдуманной ссылки в ответе не бывает.
                    Ровно те стопы, ради которых раскладка и заводилась: человеку
                    нужно знать не «не напечаталось», а почему по каждой строке."
      properties:
        data:
          $ref: '#/components/schemas/ItemLabelsResult'

    ItemLabelsCandidatesResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      type: object
      description: "Success — data with the candidates of every RID asked.
                    On a business stop (messages[].level = error) data is absent."
      properties:
        data:
          $ref: '#/components/schemas/ItemLabelsCandidates'

    ## Custom requests
    ItemLabelsCandidatesRequest:
      type: object
      description: "Body of the candidates lookup. No required fields, for the same reason
                    as ItemLabelsRequest: a missing list must answer inside the
                    dictionary, not with «Request validation failed»."
      properties:
        rids:
          type: array
          description: "RIDs to look up, up to 500. Duplicates and case are ignored."
          items:
            type: string
            example: "7BNCW"
    CompleteBoxRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: "Весь состав коробки разом. Пустой массив допустим —
                        это «коробка пришла пустой».
                        Дубликаты rid недопустимы."
          items:
            $ref: '#/components/schemas/ReceivedItem'

    CloseParcelRequest:
      type: object
      description: "Тело BOX READY. ОБЯЗАТЕЛЬНЫХ ПОЛЕЙ НЕТ НИ ОДНОГО — ни items,
                    ни измерений: отсутствие веса обязано дать 200
                    + measurements_required, а пустой состав — 500 empty_items,
                    и оба ответа команда обязана отдать САМА, кодом словаря.
                    Помеченное required поле до команды не доедет: провал
                    валидации схемы каркас превращает в HTTP 500
                    «Request validation failed» со свободным текстом
                    (AbstractHandler::runAction) — ответ без кода, разбирать
                    его приложению нечем. Пустое тело {} валидно по схеме
                    и всегда получает содержательный ответ; какой именно —
                    см. порядок проверок в описании пути."
      properties:
        items:
          type: array
          description: "Весь состав коробки разом, ровно как в complete приёмки.
                        Дубликаты rid недопустимы (500 duplicate_rid).
                        Пустой массив и отсутствие поля означают одно и то же —
                        коробка без состава, и это 500 empty_items: готовой
                        коробки без состава не бывает."
          items:
            $ref: '#/components/schemas/PackedItem'
        weight:
          type: number
          description: "Вес коробки в фунтах, одно число. fba_parcels.Weight,
                        decimal(10,3)"
          example: 14.5
        length:
          type: number
          description: "Длина в дюймах. fba_parcels.Length, decimal(10,3).
                        Три габарита едут ТРЕМЯ отдельными числами — строка
                        Dimensions мертва, колонки под неё в таблице нет"
          example: 18.0
        width:
          type: number
          description: "Ширина в дюймах. fba_parcels.Width, decimal(10,3)"
          example: 12.0
        height:
          type: number
          description: "Высота в дюймах. fba_parcels.Height, decimal(10,3)"
          example: 10.0

    ReopenParcelRequest:
      type: object
      description: "Тело возврата в переделку. Обязательных полей нет: пустая
                    причина обязана дать 200 + reason_required, то есть код
                    словаря. Пометь reason required — и каркас ответит вместо
                    этого HTTP 500 «Request validation failed» со свободным
                    текстом (AbstractHandler::runAction), из которого приложение
                    не достанет ни кода, ни подсказки человеку."
      properties:
        reason:
          type: string
          maxLength: 1000
          description: "Причина возврата. Пишется в fba_parcels.DscProblem
                        как есть, свободным текстом. Потолок — ширина колонки
                        (varchar(1000)): длиннее MySQL обрежет, а в строгом режиме
                        уронит транзакцию возврата целиком.
                        Пустая строка равносильна отсутствию поля, и строка
                        из одних пробелов тоже: reason_required смотрит на причину
                        после trim — «   » это не причина"
          example: "Wrong item inside, repack"

    ItemLabelsRequest:
      type: object
      description: "Тело печати по готовому списку. ОБЯЗАТЕЛЬНЫХ ПОЛЕЙ НЕТ НИ ОДНОГО —
                    ни items, ни чего-либо внутри строки, ровно как у CloseParcelRequest
                    и ReopenParcelRequest второй версии.
                    Пометь items required — и тело {} до команды не доедет: провал
                    валидации схемы каркас превращает в HTTP 500 «Request validation
                    failed» со свободным текстом (AbstractHandler::runAction), то есть
                    в ответ ВНЕ словаря, из которого приложение не достанет ни кода,
                    ни подсказки человеку. А отсутствующий items обязан давать
                    200 + empty_items, то есть код словаря.
                    По той же причине здесь нет ни minItems, ни maxItems: потолок
                    в 100 строк проверяет сервер и отвечает too_many_items —
                    причём по СХЛОПНУТЫМ строкам, а не по присланным."
      properties:
        items:
          type: array
          description: "Строки печати, от 1 до 100. Одна строка на MLN.
                        Потолок — не наше правило: Amazon принимает
                        не больше 100 элементов mskuQuantities за запрос."
          items:
            $ref: '#/components/schemas/ItemLabelsRequestItem'

    ItemLabelsAllocationRequest:
      type: object
      description: "Тело печати с раскладкой. Обязательных полей нет ни одного —
                    по той же причине, что и у ItemLabelsRequest: провал валидации
                    схемы каркас превращает в HTTP 500 со свободным текстом,
                    то есть в ответ ВНЕ словаря кодов.
                    Пустой allocations — законное тело: оно означает «раскладки
                    нет, резолви сам» и даёт ровно то же, что обычная печать
                    по заказу. Приложение шлёт его, когда спорных строк
                    в заказе не оказалось."
      properties:
        allocations:
          type: array
          description: "Раскладка: сколько штук какого RID на какой листинг.
                        Одна запись на пару (RID, листинг), а не на RID: строка,
                        делимая надвое, приезжает двумя записями.
                        RID, которого здесь нет, резолвится сервером сам."
          items:
            $ref: '#/components/schemas/ItemLabelsAllocation'

    ItemLabelsAllocation:
      type: object
      description: "Одна доля раскладки. Обязательных полей нет НИ ОДНОГО,
                    и это намеренно: доля без RID обязана дать 200 с кодом
                    словаря, а не HTTP 500 валидации схемы."
      properties:
        rid:
          type: string
          description: "Rollun ID товара, offers.Article. Обязан быть среди строк
                        заказа — иначе allocation_unknown_rid: раскладка
                        на товар, которого в заказе нет, означает разъехавшийся
                        экран, а не опечатку в одной цифре"
          example: "8A82V"
        mln:
          type: string
          description: "Листинг, на который идёт эта доля. Обязан быть среди
                        КАНДИДАТОВ этого RID — тех самых, что ручка раскладки
                        вернула в candidates[]. Листинг со стороны — это выбор,
                        который человеку никто не предлагал, и печать по нему
                        отправила бы железку на карточку, о которой сервер
                        не знает: allocation_unknown_mln.
                        Регистр значим для Amazon и не нормализуется"
          example: "2N-BCI2-K3LK"
        quantity:
          type: integer
          description: "Сколько штук на этот листинг. Целое, строго больше нуля:
                        доля на ноль штук это отсутствие доли, и слать её незачем.
                        Ноль, минус и дробь дают invalid_quantity.
                        Сумма долей одного RID обязана сойтись с количеством
                        строки РОВНО — недобор означал бы железки без наклеек,
                        перебор лишние наклейки, и обе цифры человек видел
                        на экране сам"
          example: 7

    ItemLabelsRequestItem:
      type: object
      description: "Строка списка печати. Обязательных полей нет НИ ОДНОГО, и это
                    намеренно: строка без товара обязана дать 200 + invalid_line,
                    а не HTTP 500 валидации схемы. Из fnsku и mln заполняется
                    РОВНО ОДНО. Обе пустые или обе заполненные — invalid_line:
                    во втором случае непонятно, что печатать, и молча выбрать одно
                    из двух значит напечатать не тот штрихкод."
      properties:
        fnsku:
          type: string
          description: "Штрихкод Amazon на единице FBA-товара. Резолвится в MLN
                        походом в fba_inventory — однозначно, FNSKU физически
                        не бывает больше одного на MLN.
                        Неизвестный FNSKU останавливает весь запрос: fnsku_not_found.
                        Поиск регистронезависим: 'x001lod5kr' найдёт ту же строку,
                        что и 'X001LOD5KR' — MySQL сравнивает без учёта регистра,
                        и группировка на нашей стороне приведена к тому же виду,
                        иначе одна заглавная буква давала бы ложный fnsku_not_found.
                        Ограничения: не длиннее 40 символов и только [A-Za-z0-9._-];
                        всё прочее — invalid_line"
          example: "X001LOD5KR"
        mln:
          type: string
          description: "Листинг (у Amazon Seller SKU). Уезжает в Amazon КАК ЕСТЬ,
                        в присланном написании, и без похода в инвентарь: это уже
                        конечный ответ на вопрос «какой листинг пополняем».
                        Регистр значим для Amazon (NBFCCfba), поэтому значение
                        не нормализуется; регистронезависимо только СХЛОПЫВАНИЕ —
                        два написания одного листинга в списке сложатся в одну
                        строку запроса вместо двух, то есть вместо duplicate_msku.
                        Ограничения те же: не длиннее 40 символов
                        и только [A-Za-z0-9._-]"
          example: "2N-BCI2-K3LK"
        quantity:
          type: integer
          description: "Сколько этикеток печатать по этой строке. Целое, строго
                        больше нуля: строка на ноль этикеток это отсутствие строки.
                        Ноль, минус и дробь дают 200 + invalid_quantity.
                        Потолок 10000 на ЛИСТИНГ (не на строку) проверяется после
                        схлопывания и даёт mln_quantity_over_limit"
          example: 1

    ## Resources
    ReceivedItem:
      type: object
      required:
        - rid
        - qty
      properties:
        rid:
          type: string
          minLength: 1
          description: "Rollun ID товара, offers.Article"
          example: "3N2W2"
        qty:
          type: integer
          minimum: 0
          description: "Сколько штук этого товара нашлось В ЭТОЙ коробке — ВСЁ найденное,
                        ВКЛЮЧАЯ битое. Целое и неотрицательное.
                        Брак здесь не вычитается: его вычитает расхождение returnToSr,
                        и ровно так устроена формула Полки."
          example: 3
        defectQty:
          type: integer
          minimum: 0
          description: "Сколько из этих qty штук битые. Поле необязательное: в нормальном
                        дне его нет вовсе, и тело запроса совпадает с первой версией.
                        Больше qty — 500 invalid_defect_qty.
                        Больше нуля требует непустого defectReason —
                        иначе 500 defect_reason_required.
                        Тип расхождения пикапер не выбирает никогда: всегда returnToSr."
          example: 2
        defectReason:
          type: string
          description: "Короткая причина брака свободным текстом, как её написал пикапер.
                        Ложится в DscProblem расхождения. Обязательна при defectQty > 0.
                        Длиннее 1000 символов — ширины DscProblem — сервер РЕЖЕТ, а не отвергает:
                        потерять хвост причины дешевле, чем не дать закрыть пересчитанную
                        коробку. Экран ограничивает ввод теми же 1000."
          example: "cracked"
        notInOrder:
          type: boolean
          description: "true — строка явно помечена «этой позиции в заказе нет».
                        Только с этим признаком RID вне состава Заказа проходит вместо
                        стопа item_not_in_order, и по такой строке заводится расхождение
                        extra. На RID, который в заказе ЕСТЬ, признак игнорируется:
                        строка идёт обычной проверкой на Left, more_than_left
                        не ослабляется ничем."

    BoxState:
      type: object
      required:
        - id
        - status
        - statusName
      properties:
        id:
          type: string
          example: "690582"
        idFbaSrOrder:
          type: string
          example: "662462"
        tracking:
          type: string
          example: "1Z093V6R0306851422"
        status:
          type: integer
          description: "1021 Parcel expecting, 1022 Parcel delivered, 1023 Parcel scanned,
                        1024 Processing, 100 Archive, 101 Wrong, 1025 Issue occurred"
          example: 100
        statusName:
          type: string
          example: "Archive"
        alreadyClosed:
          type: boolean
          description: "true — коробка была закрыта до этого запроса, мы ничего не записали.
                        Для приложения это успех, а не ошибка."
        openedAt:
          type: string
          description: "mysql date-time"
          example: "2026-08-19 14:02:11"
        idScannedBy:
          type: integer
          description: "employees.Id того, кто разбирал коробку"
          example: 70
        items:
          type: array
          description: "Состав, записанный в CRM по этой коробке.
                        Схема строки общая с запросом, но в ОТВЕТЕ заполняются только
                        rid и qty: брак и признак «не из заказа» живут отдельными
                        расхождениями, а не позициями коробки, и по составу закрытой
                        коробки не восстанавливаются."
          items:
            $ref: '#/components/schemas/ReceivedItem'

    OrderSummary:
      type: object
      required:
        - id
        - status
        - statusName
        - lines
      properties:
        id:
          type: string
          example: "662462"
        nmrSrOrder:
          type: string
          description: "Номер заказа в системе поставщика"
          example: "A8230"
        status:
          type: integer
          example: 1004
        statusName:
          type: string
          example: "Check discrepancy"
        boxesTotal:
          type: integer
          example: 3
        boxesClosed:
          type: integer
          example: 3
        unitsShort:
          type: integer
          description: "Сумма недоборов по строкам с diff < 0, по модулю.
                        Перебор по другим строкам недостачу не компенсирует.
                        0 — если недоборов нет."
          example: 2
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummaryLine'

    OrderSummaryLine:
      type: object
      required:
        - rid
        - qtyOrdered
        - qtyReceived
      properties:
        rid:
          type: string
          example: "3N2W2"
        name:
          type: string
          example: "TUSK  K54"
        qtyOrdered:
          type: integer
          example: 6
        qtyReceived:
          type: integer
          example: 4
        diff:
          type: integer
          description: "qtyReceived - qtyOrdered. Минус — недостача, плюс — перебор"
          example: -2

    PackedItem:
      type: object
      required:
        - rid
        - qty
      description: "Строка состава Коробки отправки. Внутри строки rid и qty
                    обязательны, хотя у самого тела обязательных полей нет:
                    кривой элемент состава — ошибка клиента, а не бизнес-случай,
                    и ровно так же устроен ReceivedItem приёмки."
      properties:
        rid:
          type: string
          minLength: 1
          description: "Rollun ID товара, offers.Article"
          example: "3N2W2"
        qty:
          type: integer
          minimum: 1
          description: "Сколько штук этого товара положено В ЭТУ коробку.
                        Целое и строго больше нуля: строка на ноль единиц —
                        это отсутствие строки. Столько же этикеток FNSKU
                        наклеено на товар."
          example: 7
        fnsku:
          type: string
          description: "FNSKU листинга, чьи наклейки на этих штуках
                        (hmdHHP69, D22). Обязан быть FNSKU листинга из кандидатов
                        RID — тех, что отдаёт POST /itemLabels/candidates,
                        с непустым mln: привязка в fba-inventory и вся история
                        наклеек склада; иначе 200 fnsku_not_of_rid. Пишется
                        в offers.Info.fnsku child-оффера
                        позиции, и печать по коробке берёт его, не резолвя RID.
                        Регистр и пробелы по краям не значимы.
                        Поля нет или оно пустое — листинг не записан, как раньше,
                        и печать резолвит по RID. Приложение шлёт его, когда знает
                        кандидатов RID: возможная наклейка одна — подставляет само,
                        несколько — выбирает пикапер. В ответе — записанный FNSKU,
                        у строки без него поля нет."
          example: "X00462G64D"

    ShipmentState:
      type: object
      required:
        - id
        - status
        - statusName
        - parcelsCount
        - parcelsLimit
      properties:
        id:
          type: string
          description: "Id Отправки, она же Id сделки CRM"
          example: "719257"
        status:
          type: integer
          description: "1061 Shipment filling, 1062 Shipment creation on mp,
                        1063 Shipment ID created, 1064 Tracking,
                        1065 Receiving by Amazon, 1066 Check discrepancy,
                        100 Archive, 101 Wrong.
                        Приложению нужен только 1061 — дальше Отправку ведёт
                        помощник менеджера. The app writes one step itself:
                        1061 -> 1062 on «FINISH PACKING»"
          example: 1061
        statusName:
          type: string
          example: "Shipment filling"
        nmSender:
          type: string
          description: "Склад-отправитель, fba_shipments.NmSender.
                        Выводится сервером из вошедшего сотрудника, клиентом
                        не присылается"
          example: "pickup_cn"
        idShipment:
          type: string
          description: "Amazon Shipment ID, fba_shipments.IdShipment.
                        Приложением не создаётся: его проставляет помощник
                        менеджера, когда он появится"
          example: "FBA19M0XLLTR"
        nmShipment:
          type: string
          description: "STA (Ship to Amazon), fba_shipments.NmShipment.
                        Начало упаковки не блокирует и приложением не пишется"
          example: "STA (8/17/2026, 02:19 PM)"
        parcelsCount:
          type: integer
          description: "Сколько Коробок отправки уже заведено в этой Отправке"
          example: 3
        parcelsLimit:
          type: integer
          description: "Потолок коробок в Отправке — константа конфига сервиса,
                        по умолчанию 10. Едет в ответе, а не зашивается в клиент:
                        «N of 10» на экране рисуется данными Отправки, и подъём
                        потолка не требует релиза приложения"
          example: 10
        alreadyOpen:
          type: boolean
          description: "true — Отправка существовала до этого запроса, мы ничего
                        не создали. Для приложения это успех: оно открывает
                        существующую Отправку"
        alreadyClosed:
          type: boolean
          description: "Only in the answer to POST /fbaShipments/{id}/close.
                        false — this request moved the shipment out of 1061;
                        true — it was not in 1061 already and nothing was written.
                        Both are a success for the app: the shipment is no longer open"

    ParcelState:
      type: object
      required:
        - id
        - status
        - statusName
      properties:
        id:
          type: string
          description: "Id Коробки отправки, она же Id сделки CRM"
          example: "719265"
        idShipmentCrm:
          type: string
          description: "Id Отправки, которой принадлежит коробка,
                        fba_parcels.IdShipmentCrm. Коробка принадлежит ровно
                        одной Отправке"
          example: "719257"
        nmrBox:
          type: integer
          description: "Номер коробки внутри Отправки, fba_parcels.NmrBox.
                        Присваивает сервер по порядку создания"
          example: 1
        status:
          type: integer
          description: "1041 Parcel filling, 1042 Measured, 100 Archive, 101 Wrong"
          example: 1042
        statusName:
          type: string
          example: "Measured"
        alreadyClosed:
          type: boolean
          description: "true — коробка была закрыта до этого запроса, мы ничего
                        не записали. Для приложения это успех, а не ошибка"
        weight:
          type: number
          description: "Вес в фунтах, fba_parcels.Weight"
          example: 14.5
        length:
          type: number
          description: "Длина в дюймах, fba_parcels.Length"
          example: 18.0
        width:
          type: number
          description: "Ширина в дюймах, fba_parcels.Width"
          example: 12.0
        height:
          type: number
          description: "Высота в дюймах, fba_parcels.Height"
          example: 10.0
        idScannedBy:
          type: integer
          description: "employees.Id того, кто собирал коробку"
          example: 70
        nmPickuper:
          type: string
          description: "Имя пикапера, производное от idScannedBy —
                        берётся из employees, а не вводится руками"
          example: "Victoria Hrushak"
        dscProblem:
          type: string
          description: "Причина возврата в переделку, fba_parcels.DscProblem.
                        Заполняется командой reopen; при закрытии коробки
                        не трогается"
          example: "Wrong item inside, repack"
        items:
          type: array
          description: "Состав, записанный в CRM по этой коробке. У коробки,
                        только что созданной либо вернувшейся из переделки,
                        пуст — и это не ошибка, а нормальное состояние"
          items:
            $ref: '#/components/schemas/PackedItem'

    ItemLabelsResult:
      type: object
      required:
        - labelsTotal
        - linesPrinted
        - linesFailed
        - lines
      description: "Итог печати. Четыре обязательных поля есть ВСЕГДА, включая стоп
                    nothing_to_print, — а url, expiresAt, fileName и fileContent
                    необязательны ровно поэтому: у стопа их нет, печатать было нечего.
                    Счётчики считаются по строкам раскладки, а не по строкам,
                    уехавшим в Amazon: два RID, резолвнувшихся в один MLN,
                    схлопываются в одну строку запроса к Amazon, но в раскладке
                    остаются обе, и обе считаются напечатанными.
                    Один объект обслуживает ДВА способа получить те же наклейки:
                    печать через SP-API отдаёт url плюс expiresAt, выгрузка
                    Create workflow — fileName плюс fileContent. Раскладка,
                    счётчики и коды по строкам у них общие и считаются одинаково;
                    различается ровно артефакт. Пары взаимоисключающие: url
                    и fileContent в одном ответе не встречаются никогда."
      properties:
        url:
          type: string
          description: "Ссылка на PDF с этикетками, подписанная S3.
                        ЖИВЁТ ОКОЛО 29 СЕКУНД (X-Amz-Expires=29 в подписи, хотя
                        поле expiration в ответе Amazon обещает минуту).
                        Приложение обязано перейти на неё немедленно, тем же жестом
                        пользователя, а не показывать её экраном «нажмите, когда
                        будете готовы». Наружу идёт ссылка, а не байты файла.
                        Отсутствует при любом стопе"
          example: "https://fba-api-marketplace-item-labels-na.s3.amazonaws.com/itemLabel-0000.pdf?X-Amz-Expires=29"
        expiresAt:
          type: string
          description: "Когда ссылка протухнет, ISO-8601, как это сообщил Amazon.
                        Отдаётся как есть, для отображения: полагаться на него как
                        на реальное окно нельзя — в подписи стоит 29 секунд,
                        а тут приходит минута. Отсутствует при любом стопе"
          example: "2026-09-02T13:13:04+00:00"
        fileName:
          type: string
          description: "Имя файла Create workflow template, который человек грузит
                        в Send to Amazon. Есть ТОЛЬКО у ручек workflowFile и только
                        когда файл собран; у печати через SP-API и при любом стопе
                        отсутствует"
          example: "amazon-create-workflow-order-719944.txt"
        fileContent:
          type: string
          description: "САМ ФАЙЛ, текстом. Формат — tab-delimited, второй из двух,
                        которые Amazon называет в инструкции к шаблону
                        (лист Instructions, шаг 4: Option 2 — save the Create
                        workflow template spreadsheet as a tab-delimited file
                        (.txt) and upload it via Seller Central). CSV в том списке
                        НЕТ, старого .xls тоже — только .xlsx и этот .txt.
                        Байтами, а не ссылкой: файл крошечный — сотня строк
                        по два заполненных поля, — живёт ровно один жест человека
                        и нигде не сохраняется: ни в S3, ни на диск, ни в CRM.
                        Разделитель полей табуляция, конец строки CRLF, кодировка
                        ASCII — шаблон Amazon не допускает не-английских символов
                        в Merchant SKU, и это его требование, не наше.
                        Отсутствует у печати через SP-API и при любом стопе"
          example: "Please review the Example tab before you complete this sheet\r\n\r\nDefault prep owner\tSeller\r\n"
        labelsTotal:
          type: integer
          description: "Сколько этикеток в PDF: сумма quantity по строкам
                        со status printed и printed_inactive.
                        У nothing_to_print — 0.
                        У ручек workflowFile считается так же — это число наклеек,
                        которые человек получит, загрузив файл"
          example: 225
        linesPrinted:
          type: integer
          description: "Сколько строк раскладки уехало в печать (printed
                        плюс printed_inactive)"
          example: 16
        linesFailed:
          type: integer
          description: "Сколько строк раскладки НЕ уехало в печать (ambiguous
                        плюс not_found). Ноль означает, что заказ разобрался целиком"
          example: 2
        lines:
          type: array
          description: "Раскладка ПО ВСЕМ строкам: и напечатанным, и нет.
                        Строки с нулевым количеством в неё не попадают вовсе —
                        печатать по ним нечего, а Amazon требует quantity >= 1.
                        Отдаётся целиком всегда: молчаливый пропуск здесь это
                        железка, уехавшая на Amazon без этикетки, и разгребать
                        её будут уже там"
          items:
            $ref: '#/components/schemas/ItemLabelsLine'

    ItemLabelsLine:
      type: object
      required:
        - quantity
        - status
      description: "Строка раскладки. rid заполнен у печати по заказу, fnsku —
                    у ручного списка; mln появляется, только когда строка
                    резолвилась, то есть у printed и printed_inactive."
      properties:
        rid:
          type: string
          description: "Rollun ID товара, offers.Article. Есть у печати по заказу;
                        у ручного списка отсутствует — там товар опознан по FNSKU"
          example: "8A82V"
        fnsku:
          type: string
          description: "Штрихкод, который будет напечатан. Для резолвнувшейся строки
                        приходит из инвентаря вместе с MLN"
          example: "X001LOD5KR"
        mln:
          type: string
          description: "Листинг, выбранный резолвером. Пусто у ambiguous и not_found:
                        именно его выбрать и не удалось"
          example: "2N-BCI2-K3LK"
        name:
          type: string
          description: "Название товара из строки заказа — чтобы человек узнал
                        железку глазами, не сверяя RID"
          example: "TUSK Folding Shift Lever"
        quantity:
          type: integer
          description: "Сколько этикеток по этой строке. Для заказа это БОЛЬШЕЕ
                        из QtyOrdered и QtyReceived, а не одно только принятое:
                        наклейки нужны пикеру заранее, до вскрытия коробки, —
                        лишняя наклейка стоит ноль и летит в мусор, а нехватка
                        останавливает работу. Для упаковки и ручного списка —
                        присланное количество"
          example: 12
        quantityOrdered:
          type: integer
          description: "Сколько заказано по этой строке, QtyOrdered. Есть только
                        у печати по заказу приёмки. Приходит ВСЕГДА, а не только
                        при расхождении: приложение сравнивает две цифры само
                        и показывает подсказку «заказано 13, принято 9 — печатаем
                        по заказанному». Молча подставить другое число нельзя"
          example: 13
        quantityReceived:
          type: integer
          description: "Сколько фактически принято по этой строке, QtyReceived.
                        Ноль означает, что коробку ещё не вскрывали, и это НЕ отказ:
                        печатаем по заказанному. [посчитано по проду за год]
                        заказано = принято в 2687 строках из 2909, принято меньше
                        в 119, БОЛЬШЕ в 26 — из-за этих 26 и берётся максимум"
          example: 9
        status:
          type: string
          enum:
            - printed
            - printed_inactive
            - ambiguous
            - not_found
            - over_limit
          description: "printed — резолвилось в единственный активный MLN, уехало
                        в PDF. printed_inactive — активных MLN у RID нет, но нашёлся
                        ровно один любой: берём его и печатаем, строка едет
                        с code mln_inactive_used. Правило вытаскивает 70 RID
                        из 73 проблемных, без него ручной работы было бы 22% строк
                        вместо 5%. ambiguous — выбрать MLN не смог: в PDF не идёт,
                        кандидаты в candidates[]. not_found — товара нет
                        в инвентаре вовсе либо у найденной строки нет пригодного
                        mln, в PDF не идёт. over_limit — на этот листинг вышло
                        больше 10000 этикеток, потолка Amazon: в PDF не идёт,
                        остальное печатается.
                        Строка, не попавшая в PDF, НИКОГДА не приходит с printed:
                        соврать «напечатано» про этикетку, которой в файле нет,
                        значит отправить железку на Amazon без штрихкода"
          example: "printed"
        code:
          type: string
          description: "Код причины по этой строке: mln_inactive_used (у status
                        printed_inactive), mln_ambiguous (у ambiguous),
                        mln_not_found (у not_found),
                        mln_quantity_over_limit (у over_limit).
                        У status printed кода нет — объяснять нечего"
          example: "mln_ambiguous"
        candidates:
          type: array
          description: "Кандидаты MLN у неоднозначной строки. Непуст ТОЛЬКО
                        при status ambiguous.
                        Автовыбор запрещён навсегда, а не «пока»: у всех девяти
                        неоднозначных RID прода число MLN равно числу MSIN —
                        это не дубли одного каталожного товара, а одна физическая
                        деталь под разными ASIN. Наклеенный FNSKU и есть указание
                        Amazon, к какому каталожному товару зачислить приехавшую
                        железку, и в данных нет ничего, что подсказало бы верный
                        выбор в конкретный день"
          items:
            $ref: '#/components/schemas/MlnCandidate'

    MlnCandidate:
      type: object
      required:
        - mln
      description: "Кандидат на выбор человеком. Набор полей подобран так, чтобы
                    выбор не был гаданием по названию: без MSIN менеджер не видит,
                    какой ASIN он пополняет, а это и есть суть выбора."
      properties:
        mln:
          type: string
          description: "Листинг, у Amazon Seller SKU. Первичный ключ инвентаря,
                        дублей по нему нет. Пустой бывает только в ответе
                        POST /itemLabels/candidates — у наклейки из истории склада,
                        которой листинга в fba-inventory нет: выбрать её нельзя,
                        но возможной наклейкой она считается"
          example: "2N-BCI2-K3LK"
        msin:
          type: string
          description: "Товар в каталоге маркетплейса, у Amazon ASIN. САМОЕ ВАЖНОЕ
                        поле выбора: разные MSIN у кандидатов означают, что это
                        разные каталожные товары, и выбор MLN это выбор,
                        какой из них мы пополняем"
          example: "B011AO8RTU"
        fnsku:
          type: string
          description: "Штрихкод, который напечатается, если выбрать этого кандидата.
                        Им же человек и добивает строку через POST /itemLabels"
          example: "X001LOD5KR"
        mpStatus:
          type: string
          description: "Статус листинга на маркетплейсе. Принимает ровно два
                        значения в нижнем регистре — active и inactive"
          example: "active"
        fbaAvailableQty:
          type: integer
          description: "Остаток этого листинга на складе Amazon. Подсказка, а не
                        правило: склад сознательно пополняет то один ASIN,
                        то другой — где кончился остаток, где выиграна Buy Box"
          example: 15
        mpTitle:
          type: string
          description: "Название листинга на маркетплейсе — по нему человек
                        и опознаёт, под какую модель этот вариант"
          example: "Tusk Folding Shift Lever Black/Red Tip - Fits: Honda"
        fromHistory:
          type: boolean
          description: "Кандидат добыт ИСТОРИЕЙ наклеек склада, а не привязкой
                        в инвентаре: fba-inventory числит этот листинг за другим
                        RID, но клеили им именно этот товар.
                        Приходит true у тех и только тех кандидатов, где два
                        источника расходятся. Показать пометку человеку
                        обязательно: иначе он видит кандидата, у которого ASIN
                        из другой оперы, и не понимает почему.
                        [найдено 10.09.2026] листинг 56-RG9W-ZN5N (FNSKU
                        X0033IR1ZT) записан на rid 5FKWK, а склад клеил его
                        на 8A82V — и продолжает клеить. Пока привязку
                        не поправят руками, это единственный способ его увидеть.
                        Автоматический выбор такой кандидат НЕ отменяет:
                        он дополняет список там, где выбор и так за человеком"
          example: false

    ItemLabelsCandidates:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: "One entry per valid RID asked, in the order of the request"
          items:
            $ref: '#/components/schemas/RidCandidates'

    RidCandidates:
      type: object
      required:
        - rid
        - candidates
      properties:
        rid:
          type: string
          description: "RID as it was asked"
          example: "7BNCW"
        candidates:
          type: array
          description: "Every listing of the RID, active and inactive; empty when neither
                        the inventory nor the label history knows the RID"
          items:
            $ref: '#/components/schemas/MlnCandidate'
