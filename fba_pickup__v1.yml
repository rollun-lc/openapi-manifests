openapi: 3.0.0
info:
  version: "1"
  title: "FbaPickup"
  description: "Операции склада-подбора над сущностями FBA: приёмка коробок от поставщика,
                подведение итога по закупке и упаковка товара с Полки в коробки,
                уезжающие на Amazon.
                Сервис пишущий — всё чтение идёт существующими датасторами CRM
                (FbaSrBoxesDataStore, FbaSrOrdersDataStore, FbaSrOrdersWithBoxesByPositions,
                FbaShelf, FbaParcelsDataStore, FbaShipmentsDataStore,
                FbaParselsWithShipmentsByPositions) и каталога (RollunIdWithCsnView).
                Имена путей повторяют имена сущностей CRM: fbaSrBoxes и fbaSrOrders —
                приёмка, fbaShipments и fbaParcels — упаковка.
                HTTP-коды — только 200 и 500: бизнес-стоп не HTTP-ошибка, его код едет
                в messages[].text с level: error внутри 200 (решение 20.08)."
servers:
  - url: http://rollun-crm/openapi/FbaPickup/v1
  - url: https://rollun.net/api/openapi/FbaPickup/v1
tags:
  - name: FbaSrBoxes
  - name: FbaSrOrders
  - name: FbaShipments
  - name: FbaParcels
  - name: ItemLabels
  - name: CurrentEmployee
paths:
  "/fbaSrBoxes/{id}/open":
    post:
      tags:
        - FbaSrBoxes
      description: "Кнопка «Box opened». Переводит коробку в 1024 Processing,
                    проставляет DtOpened и IdScannedBy.
                    Исходные статусы: 1021 Parcel expecting, 1022 Parcel delivered.
                    1023 Parcel scanned в v1 никто не ставит: коробка в этом статусе —
                    нештатное состояние, ответ 500 unexpected_box_status.
                    Идемпотентна: если коробка уже в 1024, отвечает 200 и ничего не меняет —
                    повторное нажатие должно пускать человека дальше, а не останавливать его.
                    Повтор НЕ дозаполняет пустые DtOpened/IdScannedBy.
                    Статус меняется условием внутри запроса (queriedUpdate по Status),
                    а не проверкой перед записью."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id коробки, она же Id сделки CRM"
          example: "690582"
      responses:
        "200":
          description: "Коробка открыта либо уже была открыта.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: box_already_closed (коробка в 100 Archive),
                        box_not_receivable (101 Wrong, 1025 Issue occurred),
                        box_not_found (коробки с таким Id в CRM нет)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудник
                        с таким AclUserId не заведён в employees),
                        unexpected_box_status (коробка в статусе, которого v1
                        не ставит, в том числе 1023 Parcel scanned)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaSrBoxes/{id}/complete":
    post:
      tags:
        - FbaSrBoxes
      description: "Кнопка «No items left». Записывает ВЕСЬ фактический состав коробки
                    и переводит её 1024 -> 100 Archive одной транзакцией: либо записано
                    целиком, либо не записано вовсе.
                    Отдельной команды на строку состава нет намеренно — незакрытая коробка
                    не должна оставлять в CRM следа, иначе откат на Google-таблицу перестаёт
                    быть бесплатным, а полка показывает товар, которого на ней нет.
                    Позиции, которых нет в items, означают «этого товара в коробке не было»;
                    нулями их передавать не нужно.
                    Полка (view_fba_shelf) отдельного обновления не требует — она вьюха
                    над этими же позициями и меняется в тот же момент.
                    Брак и лишний товар едут той же командой, необязательными полями строки
                    (defectQty/defectReason, notInOrder) — отдельной команды на них нет.
                    В состав коробки пишется ВСЁ найденное, включая брак, а на строку
                    с браком заводится расхождение returnToSr; на строку, помеченную
                    notInOrder и отсутствующую в составе Заказа, — расхождение extra.
                    Расхождение несёт IdFbaSrBox (родитель-коробка), IdScannedBy и причину
                    в DscProblem; IdFbaSrOrder остаётся пустым — этого требует
                    констрейнт only_one_filled.
                    Расхождения пишутся ТОЙ ЖЕ транзакцией, что состав и статус: коробка
                    без расхождения либо расхождение без коробки не появляются."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "690582"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteBoxRequest'
      responses:
        "200":
          description: "Коробка закрыта. Если она уже была закрыта, ответ тот же,
                        alreadyClosed = true и items — то, что записано в CRM.
                        Приложение показывает это как успех: двойное нажатие не должно
                        уводить коробку в исключение.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: item_not_in_order, more_than_left,
                        box_not_receivable (101 Wrong, 1025 Issue occurred),
                        box_not_found (коробки с таким Id в CRM нет);
                        состав при стопе не записывается.
                        item_not_in_order срабатывает только на строке БЕЗ признака
                        notInOrder: с признаком RID вне заказа — валидный лишний товар.
                        more_than_left признак не ослабляет: RID, который в заказе есть,
                        сверх Left не проходит и с ним."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудник
                        с таким AclUserId не заведён в employees),
                        box_not_opened (коробку не открывали — статус 1021/1022),
                        unexpected_box_status (коробка в статусе, которого v1
                        не ставит, в том числе 1023 Parcel scanned),
                        duplicate_rid (в items два элемента с одним rid),
                        invalid_qty (отрицательный qty — схема требует minimum: 0),
                        invalid_defect_qty (defectQty отрицательный либо больше qty —
                        битого не бывает больше, чем нашлось; из UI недостижимо,
                        экран гасит SAVE),
                        defect_reason_required (defectQty > 0, а defectReason пуст либо
                        из одних пробелов — причина обязательна: расхождение без причины
                        менеджеру нечитаемо, и ровно этот пробел часть E и закрывает),
                        origin_offer_not_found (для строки без признака notInOrder — rid есть
                        в позициях заказа, но origin-оффера с таким Article в каталоге CRM нет;
                        для строки С признаком — его не нашлось и досоздать не вышло,
                        потому что каталог такого rid не знает либо недоступен).
                        Состав и расхождения при этом не записываются."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaSrOrders/{id}/finish":
    post:
      tags:
        - FbaSrOrders
      description: "«Это была последняя коробка». Сверяет заказанное с фактически принятым
                    по всем коробкам заказа и ВОЗВРАЩАЕТ РАЗНИЦУ ПИКАПЕРУ — он ещё стоит
                    над коробками и может пересмотреть.
                    Переводит заказ в 1004 Check discrepancy. Заказ НЕ архивирует:
                    коробка по этому заказу может приехать и через 60 дней, архивирует
                    менеджер.
                    Идемпотентна: повтор на заказе уже в 1004 отвечает 200 с тем же
                    пересчитанным итогом, статус не меняется.
                    Ту же сверку считает колбэк при каждой закрытой коробке — он нужен
                    и старому процессу, для коробок, закрытых руками в CRM."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id заказа поставщику (сделка FbaSrOrder)"
          example: "662462"
      responses:
        "200":
          description: "Итог по заказу построчно.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: order_has_open_boxes (у заказа есть незакрытые
                        коробки ЛИБО коробок у него нет вовсе — в обоих случаях
                        закрывать нечего и итог не отдаётся),
                        order_not_found (заказа с таким Id в CRM нет).
                        Незакрытая коробка — коробка заказа в любом статусе,
                        кроме 100 Archive."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудник
                        с таким AclUserId не заведён в employees — итог подводит
                        человек, и в actions_history обязан лечь его employeeId),
                        unexpected_order_status (заказ в статусе, из которого finish
                        не работает: 100 Archive, 101 Wrong, 1005 Issue occurred —
                        такой заказ двигает менеджер, а не пикапер;
                        DscProblem при этом не переписывается).
                        Разрешённые исходные статусы — 1001 Tracknumbers expecting,
                        1002 On way, 1003 Unpacking (переводятся в 1004)
                        и сам 1004 (повтор, статус не меняется)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/currentEmployee":
    get:
      tags:
        - CurrentEmployee
      # operationId is required here for the same reason as at /fbaShipments:
      # without it the generator derives the bare «Get» and the Rest object
      # answers with the generic get() instead of this read.
      operationId: currentEmployeeGet
      description: "Who is signed in and which warehouse the app works on for them
                    (FR-37 of the packing PRD: the warehouse follows the signed-in
                    employee, there is no choice on the screen). The app reads the
                    receiving queue, the shelf and the open shipment for this
                    warehouse. It is the same employee -> warehouse map the packing
                    commands use, so what the app shows and where a shipment is
                    written cannot disagree. Before this read the app took the
                    warehouse from front_config, which holds one value for everybody,
                    and the Utah picker saw the Conroe shelf
                    (https://trello.com/c/y2SeuUr2)."
      responses:
        "200":
          description: "The employee and their warehouse."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentEmployeeResponse'
        "500":
          description: "Refusal, text in messages[].text:
                        employee_not_resolved (no X-User-Acl-Id, or no employees row
                        with that AclUserId),
                        warehouse_not_resolved (the employee exists but is not mapped
                        to any warehouse). There is no fallback warehouse."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaShipments":
    post:
      tags:
        - FbaShipments
      # operationId обязателен именно здесь и только здесь. Без него генератор
      # выводит имя действия из пути и метода — fbaShipmentsPost, — а оно после
      # отсечения имени тега схлопывается в зарезервированное «Post», и Rest-объект
      # получает generic post($bodyData) вместо своего метода. Для команды БЕЗ ТЕЛА
      # это тупик: generic post зовёт extractFromTypedData(null) и падает
      # LogicException до контроллера. operationId уводит команду в custom action.
      operationId: fbaShipmentsCreatePost
      description: "Кнопка «+ SHIPMENT». Создаёт Отправку в статусе 1061 Shipment filling
                    со складом вошедшего: строка в deals (ProgramId = 104) и строка
                    в fba_shipments с NmSender = склад.
                    Тела у запроса нет намеренно. Склад выводится сервером из вошедшего
                    сотрудника, а не присылается клиентом: иначе серверный инвариант
                    «открытая Отправка своего склада ровно одна» стал бы клиентским.
                    IdShipment (Amazon Shipment ID), NmShipment (STA) и DscProblem
                    остаются пустыми — их проставляет помощник менеджера позже.
                    Повтор не создаёт вторую Отправку: у склада уже есть Отправка
                    в 1061 — ответ 200 с кодом shipment_already_open, data несёт
                    СУЩЕСТВУЮЩУЮ Отправку и alreadyOpen = true. Для приложения это
                    успех, экран исключения не показывается.
                    Отправку по лестнице приложение не ведёт — этим занят помощник
                    менеджера. The one exception is «FINISH PACKING»,
                    POST /fbaShipments/{id}/close, 1061 -> 1062."
      responses:
        "200":
          description: "Отправка создана либо уже была открыта.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: shipment_already_open (у склада уже есть
                        Отправка в 1061). Это единственный код словаря упаковки,
                        после которого приложение НЕ показывает экран исключения:
                        data несёт существующую Отправку, и апка просто открывает её.
                        parcelsCount и parcelsLimit едут в data всегда — потолок
                        в десять коробок это константа конфига сервиса, клиент
                        его не знает и зашивать не должен."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудника
                        с таким AclUserId не заведено в employees),
                        warehouse_not_resolved (сотрудник есть, а склада за ним
                        не числится: колонки склада в employees нет вовсе, карта
                        «employee -> склад» живёт константой конфига рядом
                        с потолком коробок)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaShipments/{id}/parcels":
    post:
      tags:
        - FbaShipments
      description: "Кнопка «+ SHIPMENT PARCEL». Создаёт Коробку отправки в статусе
                    1041 Parcel filling внутри указанной Отправки: строка в deals
                    (ProgramId = 103) и строка в fba_parcels с IdShipmentCrm, NmrBox,
                    IdScannedBy и NmPickuper вошедшего.
                    Тела у запроса нет: всё, что нужно команде, — Id Отправки в пути
                    и личность в заголовке.
                    NmrBox присваивает СЕРВЕР — 1, 2, 3… по порядку внутри Отправки,
                    под блокировкой строки Отправки: два одновременных нажатия
                    не должны дать двух коробок с одним номером. Руками номер
                    больше не вводится.
                    Потолок коробок проверяется ПОД ТОЙ ЖЕ блокировкой, что
                    и вычисление NmrBox, — иначе двойной тап заведёт коробку
                    сверх потолка.
                    Коробка создаётся пустой: ни состава, ни измерений до close,
                    и Полка её не видит. Пустая коробка не удаляется — пикапер
                    доиспользует её в следующий заход."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Отправки, она же Id сделки CRM"
          example: "719257"
      responses:
        "200":
          description: "Коробка создана. data — состояние коробки, shipment —
                        состояние Отправки уже с новой коробкой в parcelsCount,
                        чтобы экран обновил «N of 10» без второго запроса.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: shipment_not_found (Отправки с таким Id
                        в CRM нет), shipment_not_open (Отправка не в 1061),
                        shipment_full (в Отправке уже parcelsLimit коробок).
                        При стопе коробка не создаётся."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудника
                        с таким AclUserId не заведено в employees — коробка
                        принадлежит человеку, и IdScannedBy обязан лечь непустым)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaShipments/{id}/close":
    post:
      tags:
        - FbaShipments
      description: "The «FINISH PACKING» button. Moves the shipment 1061 Shipment filling ->
                    1062 Shipment creation on mp: the pickuper says the shipment is packed,
                    and the warehouse may open the next one with «+ SHIPMENT».
                    Without this command a full shipment stayed in 1061 until a manager
                    moved it by hand, and the warehouse could neither add a box nor
                    start a new shipment (https://trello.com/c/xF8ikwih).
                    No request body: the shipment id in the path and the identity
                    in the header are all the command needs.
                    The status is checked and written under the lock of the shipment row,
                    the same lock «+ NEW BOX» and «BOX READY» take: a box cannot appear
                    or close in the middle of the check.
                    Only 1061 is moved. The app still does not drive the rest of the
                    ladder: Amazon Shipment ID, STA and the next statuses stay with
                    the manager.
                    A repeat is a success: a shipment that is no longer in 1061 comes
                    back as it is, with alreadyClosed = true and nothing written."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Shipment Id, which is also the CRM deal Id"
          example: "719257"
      responses:
        "200":
          description: "The shipment is closed, or was closed before (alreadyClosed = true).
                        A business stop comes with the same code, in messages[].text
                        with level: error, and without data:
                        shipment_not_found (no shipment with this Id in CRM, or the Id
                        is not numeric),
                        shipment_empty (the shipment has no boxes; there is nothing
                        to send, and the empty shipment is reused by the next
                        «+ SHIPMENT»),
                        shipment_has_open_boxes (a box is still in 1041 Parcel filling;
                        it is somebody's unfinished work and may hold a draft on a phone).
                        Nothing is written on a stop."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "500":
          description: "Processing error. employee_not_resolved (no X-User-Acl-Id, or no
                        employee with this AclUserId in employees) and unexpected
                        exceptions with free text."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaParcels/{id}/close":
    post:
      tags:
        - FbaParcels
      description: "Кнопка «BOX READY». Записывает ВЕСЬ состав коробки, вес и три
                    габарита и переводит её 1041 -> 1042 Measured одной транзакцией:
                    либо записано целиком, либо не записано вовсе.
                    Отдельной команды на строку состава нет намеренно — незакрытая
                    коробка не должна оставлять в CRM следа, иначе откат на
                    Google-таблицу перестаёт быть бесплатным, а Полка показывает
                    товар, которого на ней нет.
                    ОБЯЗАТЕЛЬНЫХ ПОЛЕЙ В ТЕЛЕ НЕТ НИ ОДНОГО, и это не небрежность:
                    закрытие без веса обязано дать 200 + measurements_required —
                    то есть код словаря. Пометь поле required, и до команды запрос
                    не дойдёт вовсе: каркас превращает провал валидации схемы
                    в HTTP 500 со свободным текстом «Request validation failed»
                    (AbstractHandler::runAction), а такой ответ приложению
                    разбирать нечем — кода словаря в нём нет. Пустое тело {}
                    валидно по схеме, и ответ на него — код словаря.
                    ПОРЯДОК ПРОВЕРОК ОБЪЯВЛЕН И ОБЯЗАТЕЛЕН — тот же, каким уже
                    идёт complete первой версии, чтобы у двух команд одного
                    сервиса не было двух разных дисциплин:
                      1. личность: employee_not_resolved (500);
                      2. годность Id из пути: parcel_not_found (200), если Id
                         не число — MySQL привёл бы «640367abc» к 640367
                         и команда отработала бы по чужой коробке;
                      3. форма запроса, ДО транзакции: empty_items,
                         duplicate_rid (оба 500);
                      3а. FNSKU строк, у которых он есть, сверяется с кандидатами
                         их RID тоже ДО транзакции: запрос к fba-inventory
                         не держит строки коробки и Отправки. Ответ на сверку —
                         на шаге 5а;
                      4. захват коробки условным UPDATE: не захватили —
                         разбор фактического состояния, parcel_not_found либо
                         parcel_locked (200), повтор по своей закрытой — успех
                         с alreadyClosed;
                      5. измерения: measurements_required (200);
                      5а. FNSKU строк: fnsku_not_of_rid (200), если FNSKU
                         не FNSKU листинга из кандидатов RID; inventory_unavailable
                         либо deal_source_unavailable (200), если при сверке
                         не ответил fba-inventory либо не прочиталась история
                         наклеек CRM. Отвечается после захвата, как и измерения:
                         запертая коробка отвечает parcel_locked, повтор по своей
                         закрытой — alreadyClosed, даже когда инвентарь
                         не отвечает;
                      6. склад Отправки: shipment_not_found (200), если связь,
                         NmSender или warehouse code непригодны;
                      7. остаток по Полке: not_enough_on_shelf (200);
                      8. запись состава: origin_offer_not_found (500) —
                         он всплывает при разрешении офферов, то есть последним,
                         ровно как в complete v1.
                    Отсюда однозначный ответ на пустое тело {} по существующей
                    коробке: 500 empty_items, а не 200 measurements_required —
                    форма запроса проверяется раньше измерений. Правило, из
                    которого этот порядок следует: 200 — «запрос понятен,
                    но склад против», 500 — «такого запроса экран прислать
                    не мог».
                    Габариты — три отдельных числа в inches, вес — одно число в lb,
                    ровно так, как они лежат в fba_parcels (decimal(10,3)). Строка
                    Dimensions не используется нигде: это мёртвое наследство карточки
                    самовывоза, и колонки Dimensions в fba_parcels нет вовсе.
                    НОЛЬ И ОТРИЦАТЕЛЬНОЕ РАВНОСИЛЬНЫ ОТСУТСТВИЮ: weight: 0
                    и height: -1 это measurements_required, а не записанная
                    коробка. Схема minimum на измерениях не ставит намеренно —
                    иначе ответом станет тот самый 500 «Request validation failed»
                    без кода словаря, а пикаперу нужен разбираемый стоп.
                    После захвата коробки команда блокирует строку её Отправки,
                    и только затем читает warehouse/view_fba_shelf. Поэтому close
                    одной Отправки сериализованы и ожидавший видит уже вычтенный
                    предыдущим close остаток. Отдельного обновления Полка не требует.
                    Статус меняется условием внутри запроса (queriedUpdate по Status),
                    а не проверкой перед записью."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Коробки отправки, она же Id сделки CRM"
          example: "719265"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseParcelRequest'
      responses:
        "200":
          description: "Коробка закрыта. Если она уже была закрыта, ответ тот же,
                        alreadyClosed = true, а items и измерения — то, что записано
                        в CRM: двойное нажатие не уводит коробку в исключение.
                        shipment несёт состояние Отправки после закрытия.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: parcel_not_found (Коробки отправки с таким Id
                        в CRM нет), parcel_locked (коробка не в 1041 — после Measured
                        состав и измерения заперты, вернуть в работу может только
                        reopen), shipment_not_found (нет пригодной связи с Отправкой
                        либо её NmSender после trim не pickup_cn/pickup_ut),
                        not_enough_on_shelf (по view_fba_shelf столько не набирается),
                        measurements_required (нет веса либо любого
                        из трёх габаритов — а также если любое из четырёх чисел
                        пришло нулём или отрицательным: коробка нулевой ширины
                        это незаполненное поле, а не измерение),
                        fnsku_not_of_rid (FNSKU строки не FNSKU листинга из кандидатов
                        её RID: привязка в инвентаре могла смениться после того,
                        как экран показал выбор, — экран перечитывает Полку),
                        inventory_unavailable либо deal_source_unavailable (при
                        сверке FNSKU не ответил fba-inventory либо не прочиталась
                        история наклеек CRM — повторить; без FNSKU в строках
                        сверки нет вовсе).
                        При стопе не записывается ничего: ни состав, ни измерения,
                        и коробка остаётся в 1041."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудника
                        с таким AclUserId не заведено в employees),
                        empty_items (состав пуст — коробка без состава не бывает
                        готовой, а экран туда не пускает),
                        duplicate_rid (в items два элемента с одним rid),
                        invalid_qty (qty меньше единицы),
                        origin_offer_not_found (rid есть на Полке, но origin-оффера
                        с таким Article в каталоге нет).
                        Состав при этом не записывается.
                        Про invalid_qty отдельно, чтобы не искали его в логах зря:
                        ПО HTTP ДО НЕГО НЕ ДОХОДИТ. minimum: 1 у PackedItem.qty
                        порождает валидатор схемы, и запрос с нулевым или
                        отрицательным qty каркас отбивает раньше команды —
                        ответом будет 500 «Request validation failed» со свободным
                        текстом, а не этот код. Так же устроен и invalid_qty первой
                        версии (там minimum: 0). Код остаётся подстраховкой самой
                        команды — для DTO, собранного в коде: внутренний вызов,
                        тест, будущий фоновый потребитель."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaParcels/{id}/reopen":
    post:
      tags:
        - FbaParcels
      description: "Возврат Коробки отправки в переделку: 1042 Measured (или
                    100 Archive) -> 1041 Parcel filling с обязательной причиной.
                    Команда помощника менеджера — путь из приложения пикапера
                    к ней не ведёт.
                    ОПУСТОШАЕТ коробку целиком: позиции удаляются, Weight, Length,
                    Width, Height и FinalPrice обнуляются, причина пишется
                    в DscProblem — всё одной транзакцией. Либо коробка опустела
                    целиком, либо не тронута вовсе.
                    Опустошение — не побочный эффект, а условие работоспособности.
                    Полка вычитает позиции парсела без всякого условия на его статус,
                    поэтому коробка, вернувшаяся в 1041 вместе с составом, не
                    закрылась бы повторно никогда: close ответил бы
                    not_enough_on_shelf на её же собственное содержимое.
                    Товар возвращается на Полку сам и в тот же бакет — Полка считает
                    по позициям и группирует по паре «RID + Warehouse», а расход
                    наследует Warehouse Отправки этого парсела.
                    Прежние состав, вес и габариты остаются в actions_history.
                    Тело метода — вторая очередь (часть D2); контракт, маршрут и DI
                    стоят с A2."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id Коробки отправки, она же Id сделки CRM"
          example: "719265"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenParcelRequest'
      responses:
        "200":
          description: "Коробка вернулась в 1041 пустой: items пуст, weight и три
                        габарита сняты, dscProblem — записанная причина.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: parcel_not_found (Коробки отправки с таким Id
                        в CRM нет), parcel_locked (коробка не в 1042 и не в 100 —
                        возвращать нечего), reason_required (причина пустая;
                        при этом коробка не меняется ни в чём).
                        Причина обязательна по требованию, но НЕ по схеме: пустое
                        тело обязано дать код словаря, а не HTTP 500
                        «Request validation failed» со свободным текстом, в котором
                        разбирать нечего."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelResponse'
        "500":
          description: "Ошибка обработки. Нештатные состояния, из UI недостижимые,
                        приходят этим кодом с текстом в messages[].text:
                        employee_not_resolved (нет X-User-Acl-Id либо сотрудника
                        с таким AclUserId не заведено в employees — возврат делает
                        человек, и в actions_history обязан лечь его employeeId)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaSrOrders/{id}/itemLabels":
    post:
      tags:
        - ItemLabels
      description: "Кнопка «Print FNSKU labels» по заказу приёмки. Читает фактически
                    принятое по заказу, сопоставляет каждый RID с MLN и печатает
                    этикетки Amazon на всё, что сопоставилось, — одним PDF.
                    Ссылка на PDF живёт около 29 секунд: ручка синхронная, ничего
                    не кэширует и не откладывает, а приложение обязано уйти
                    на ссылку сразу, а не показывать её «на потом».
                    Количество — БОЛЬШЕЕ из QtyOrdered и QtyReceived. Наклейки
                    нужны пикеру заранее, ДО вскрытия коробки: иначе он вскрывает
                    её и клеить нечего. Максимум, а не просто заказанное, — потому
                    что поставщик иногда кладёт больше заказанного, и тогда
                    наклеек не хватило бы. Лишняя наклейка стоит ноль и летит
                    в мусор, нехватка останавливает работу.
                    Ручка READ-ONLY — ни одной записи ни в CRM, ни в Amazon: ни
                    inbound plan, ни shipment, ни STA workflow там не создаётся,
                    в actions_history ничего не ложится. Отсюда повтор безопасен
                    по построению, и журнала напечатанного нет: повторное нажатие
                    напечатает этикетки заново на полное количество.
                    Резолв RID -> MLN неоднозначен принципиально: у одного RID
                    бывает несколько активных листингов, у каждого свой MSIN, —
                    выбор MLN это выбор, какой ASIN мы пополняем, и машина его
                    не делает. Такая строка возвращается с mln_ambiguous и списком
                    кандидатов, а печатается всё остальное.
                    Ни одна строка не пропадает молча: data.lines несёт РАСКЛАДКУ
                    ПО ВСЕМ строкам заказа с количеством > 0 — и напечатанным,
                    и нет, с кодом причины по каждой непечатанной. Молчаливый
                    пропуск здесь это железка, приехавшая на Amazon без этикетки."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id заказа поставщику (сделка FbaSrOrder)"
          example: "719944"
      responses:
        "200":
          description: "Ссылка на PDF и полная раскладка по строкам заказа.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: order_not_found (заказа с таким Id в CRM
                        нет вовсе либо Id нечисловой — MySQL привёл бы '719944abc'
                        к 719944 и напечатал бы чужой заказ),
                        order_has_no_received_items (заказ ЕСТЬ, но печатать
                        по нему нечего: ни одной строки, у которой хоть одно
                        из QtyOrdered и QtyReceived больше нуля. После того как
                        печать перестала ждать приёмку, это означает заказ
                        без позиций, а не непроведённую приёмку — код словаря
                        оставлен прежним, чтобы не ломать приложение),
                        order_source_unavailable (не ответила НАША база: вьюха
                        заказа либо чтение самого заказа),
                        inventory_unavailable (fba-inventory не ответил либо отдал
                        столько строк, что список кандидатов мог быть усечён: без
                        полных кандидатов печатать нечего, и Amazon мы не зовём),
                        amazon_labels_unavailable (amz-orders не ответил либо
                        ответил не 200; вторым сообщением едет текст от него),
                        nothing_to_print (ни одна строка заказа не резолвилась
                        в MLN — печатать физически нечего, Amazon требует минимум
                        одну строку в mskuQuantities),
                        too_many_items (заказ разошёлся больше чем на 100 листингов;
                        потолок mskuQuantities считается по СХЛОПНУТЫМ строкам,
                        и разбивать заказ будет человек).
                        Различать order_not_found и order_has_no_received_items
                        обязательно: «такого заказа нет» отправляет менеджера
                        перебирать цифры номера, который может лежать перед ним
                        верным. Поэтому при пустой вьюхе заказ дочитывается
                        отдельно, и только отдельным чтением решается, какой
                        из двух кодов отдать.
                        При стопе data, как правило, отсутствует. ИСКЛЮЧЕНИЯ —
                        nothing_to_print и too_many_items: там data ЕСТЬ и несёт
                        lines с причиной по каждой строке, labelsTotal и без url.
                        Прецедент в модуле — box_already_closed, отдающий
                        фактическое состояние коробки: это ровно те стопы, при
                        которых человеку нужнее всего именно раскладка —
                        «ничего не напечаталось» и «строк слишком много» без
                        разбора по строкам не дают ему ни одного следующего шага."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря у этой ручки здесь нет:
                        она read-only, личность ей не нужна (EmployeeResolver
                        не зовётся вовсе), а всё, что может пойти не так снаружи,
                        уже разобрано кодами 200. Сюда приходит только
                        непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/itemLabels":
    post:
      tags:
        - ItemLabels
      # operationId обязателен здесь по той же причине, что и у /fbaShipments.
      # Без него генератор выводит имя действия из пути и метода — itemLabelsPost, —
      # а оно после отсечения имени тега (ItemLabels) схлопывается
      # в зарезервированное «Post», и Rest-объект получает generic post($bodyData)
      # вместо своего именованного метода. Тело у команды есть, поэтому generic post
      # не упал бы, — но метод контроллера пришлось бы назвать просто post(),
      # рядом с fbaSrOrdersIdItemLabelsPost() в том же классе. operationId уводит
      # команду в custom action и оставляет ей собственное имя.
      operationId: itemLabelsPrintPost
      description: "Печать по готовому списку: FNSKU (либо сразу MLN) с количествами,
                    без всякого заказа. Тот же вход добивает строки, не резолвнувшиеся
                    по заказу: менеджер выбрал листинг глазами — и печатает его FNSKU.
                    FNSKU -> MLN однозначен: FNSKU физически не бывает больше одного
                    на MLN, и на данных это подтверждено — все 951 непустых FNSKU
                    в fba_inventory дают ровно один mln. Поэтому список по FNSKU
                    неоднозначности не знает вовсе, и ambiguous в его ответе не бывает.
                    Строка, несущая mln, в инвентарь не ходит и уезжает в Amazon
                    как есть: это уже конечный ответ на вопрос «какой листинг».
                    Неизвестный FNSKU останавливает ВЕСЬ запрос: не печатаем ничего.
                    Напечатать девять строк из десяти и промолчать про десятую хуже,
                    чем не печатать: это опечатка, и человек должен её увидеть.
                    Ручка READ-ONLY ровно так же, как и печать по заказу."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemLabelsRequest'
      responses:
        "200":
          description: "Ссылка на PDF и раскладка по присланным строкам.
                        Бизнес-стоп приходит этим же кодом — в messages[].text
                        с level: error: empty_items (items пуст либо поля нет),
                        too_many_items (СХЛОПНУТЫХ строк вышло больше 100 — потолок
                        mskuQuantities у Amazon. Считается именно по схлопнутым:
                        список на 101 строку, сходящийся к сорока листингам,
                        печатается, отказывать ему не за что. Тихо разбить
                        на два PDF нельзя — два PDF на один заход это изменение
                        процесса склада, а не техническое удобство),
                        invalid_quantity (quantity отсутствует либо <= 0;
                        нецелое значение отсекает валидация схемы раньше — это
                        ошибка клиента, а не бизнес-случай),
                        invalid_line (в строке пусто и fnsku, и mln — либо, наоборот,
                        заполнены обе: непонятно, что из них печатать. Сюда же
                        попадает непригодный идентификатор — длиннее 40 символов
                        либо с символом вне [A-Za-z0-9._-]: такая строка уезжает
                        в RQL-выражение in(fnsku,(...)) к чужому сервису, где
                        запятая или скобка ломают разбор и дают либо чужой набор
                        строк, либо inventory_unavailable вместо внятного отказа),
                        mln_quantity_over_limit: <fnsku|mln> (на этот листинг вышло
                        больше 10000 этикеток — потолок quantity у Amazon,
                        достижимый суммой одинаковых листингов),
                        fnsku_not_found: <fnsku> (такого FNSKU в инвентаре нет;
                        код несёт сам FNSKU после двоеточия, иначе в списке
                        из десяти строк человеку нечего искать),
                        mln_ambiguous: <fnsku> (в норме недостижим: FNSKU не бывает
                        больше одного на MLN, и на данных это подтверждено на всех
                        951 непустых FNSKU. Если он всё же пришёл — это дефект
                        данных инвентаря, и печатать по нему наугад нельзя тем более),
                        inventory_unavailable, amazon_labels_unavailable.
                        nothing_to_print (в норме недостижим: каждая строка списка
                        уже проверена на положительное количество и на резолв, —
                        ветка держит инвариант «Amazon не зовём с пустым
                        mskuQuantities»),
                        order_source_unavailable у этой ручки не бывает: своей базы
                        она не читает вовсе.
                        Не печатается НИЧЕГО ни при одном из них: в отличие
                        от печати по заказу, здесь частичный результат недопустим —
                        список составлял человек.
                        При этом data ЕСТЬ у стопов, разбирающих строки, —
                        fnsku_not_found, mln_ambiguous, mln_quantity_over_limit,
                        too_many_items и nothing_to_print: код в messages[0] назовёт
                        ПЕРВУЮ сломанную строку, а раскладка пометит ВСЕ. Человек,
                        опечатавшийся в трёх штрихкодах из десяти, обязан увидеть
                        все три сразу, а не узнавать о них за три захода.
                        У остальных стопов (empty_items, invalid_quantity,
                        invalid_line, inventory_unavailable,
                        amazon_labels_unavailable) разбирать нечего и data нет.
                        Строка, несущая mln, в инвентарь не ходит: список целиком
                        из mln не обращается к fba-inventory вовсе."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Ошибка обработки. Кодов словаря здесь нет по той же причине,
                        что и у печати по заказу: ручка read-only и личности
                        не требует. Сюда приходит только непредвиденное исключение
                        со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/itemLabels/candidates":
    post:
      tags:
        - ItemLabels
      # operationId is required here for the same reason as at /itemLabels.
      operationId: itemLabelsCandidatesPost
      description: "Every Amazon listing an item can be labelled with, for a list of RIDs.
                    The shelf of the PACK screen asks it, so that an item with two
                    listings shows both barcodes instead of the one that was stuck
                    last (https://trello.com/c/xF8ikwih: RID 7BNCW has X005028CKT
                    and X00502FYJ1, the shelf showed only the first).
                    The candidates are the same the label print by shipment and
                    by box resolves from: the fba-inventory binding plus EVERY
                    FNSKU the warehouse ever stuck on the item (fromHistory = true),
                    one request for the whole list. A sticker of the history
                    without a listing comes with an empty mln: it cannot be
                    chosen, but it is a possible sticker.
                    The list is complete on purpose: PACK takes the only possible
                    sticker of a RID by itself and asks the person when there are
                    more (hmdHHP69, D22). The last sticker alone, which the
                    FbaShelf view keeps, is not enough: BOX READY writes the FNSKU
                    of its lines, so the last sticker is the last box packed,
                    and units of an older one may still lie on the shelf.
                    Nothing is chosen here and nothing is printed: a packed line
                    gets its listing at BOX READY, a received one at the LABELS
                    step. READ-ONLY, no identity needed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemLabelsCandidatesRequest'
      responses:
        "200":
          description: "data.items holds one entry per known RID with its candidates;
                        a RID unknown to the inventory and to the history comes with
                        an empty candidates list. A RID that is not a valid identifier
                        is skipped, so one odd row does not take the barcodes off
                        the whole shelf.
                        A business stop comes with the same code, in messages[].text
                        with level: error, and without data:
                        too_many_items (more than 500 RIDs, the size of the shelf
                        the app is ready to draw),
                        inventory_unavailable (fba-inventory did not answer),
                        deal_source_unavailable (the label history of CRM could
                        not be read, or it came back too long to be trusted whole).
                        On either the shelf falls back to the single FNSKU
                        of the FbaShelf view, and PACK sends no FNSKU."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsCandidatesResponse'
        "500":
          description: "Processing error. Only an unexpected exception with free text."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaSrOrders/{id}/itemLabels/plan":
    post:
      tags:
        - ItemLabels
      operationId: fbaSrOrdersIdItemLabelsPlanPost
      description: "Раскладка по заказу БЕЗ артефакта: что напечаталось бы, если
                    нажать печать прямо сейчас, и по каким строкам человеку
                    придётся выбирать самому.
                    Нужна потому, что выбор делается ДО печати, а не после.
                    У одного RID бывает несколько листингов, и приехавшую партию
                    менеджер делит между ними — 7 штук на один ASIN, 6 на другой.
                    Узнать, что делить вообще есть что, можно только из раскладки,
                    поэтому она отделена от печати в собственную ручку: показать
                    попап раскладки после того, как PDF уже сгенерирован, поздно.
                    Читает и резолвит РОВНО ТО ЖЕ и ТЕМ ЖЕ кодом, что печать
                    по заказу: те же строки, то же количество (большее
                    из QtyOrdered и QtyReceived), тот же резолв RID -> MLN,
                    те же кандидаты у неоднозначных строк.
                    ОФФЛАЙН и READ-ONLY: ни Amazon, ни amz-orders не зовутся
                    вовсе, в CRM ничего не пишется. Отсюда повтор бесплатен,
                    и трёх стопов печати у неё не бывает по построению:
                    amazon_labels_unavailable, too_many_items
                    и mln_quantity_over_limit.
                    Границы применяются ФОРМАТНЫЕ, как у выгрузки файла, а не
                    как у SP-API: раскладка обслуживает оба артефакта сразу,
                    и показать листинг, который файл принимает, а печать
                    выбрасывает, честнее, чем спрятать его от обоих. Печать
                    отсеет его сама и скажет об этом своим кодом."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id заказа поставщику (сделка FbaSrOrder)"
          example: "719944"
      responses:
        "200":
          description: "Раскладка по всем строкам заказа. Артефакта нет вовсе:
                        ни url, ни fileName, ни fileContent — их отсутствие здесь
                        норма, а не признак отказа.
                        Достижимые стопы: order_not_found,
                        order_has_no_received_items, order_source_unavailable,
                        inventory_unavailable. nothing_to_print НЕ достижим
                        и не проверяется: раскладка, в которой не резолвилось
                        ничего, — это законный ответ, и он-то человеку и нужен."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/fbaSrOrders/{id}/itemLabels/allocated":
    post:
      tags:
        - ItemLabels
      operationId: fbaSrOrdersIdItemLabelsAllocatedPost
      description: "Печать по заказу С РАСКЛАДКОЙ: количество строки делится между
                    несколькими листингами одного и того же RID.
                    Зачем: одна физическая железка продаётся на Amazon под
                    несколькими карточками, у каждой свой остаток, и приехавшую
                    партию склад делит между ними. [посчитано по проду за год]
                    так клеились 15 товаров из 412 — 13 двумя FNSKU, один тремя,
                    один четырьмя.
                    Почему ОТДЕЛЬНЫЙ путь, а не тело у существующей печати:
                    ручка без requestBody не объявляет консьюмера, и добавить
                    его значит начать отвечать 415 на POST без Content-Type —
                    то есть сломать уже выкаченное приложение на всё время,
                    пока фронт не догонит бэкенд. Разводить это по релизам
                    дороже, чем развести по путям.
                    Всё остальное — чтение заказа, количество, резолв, границы,
                    артефакт, стопы — РОВНО как у печати по заказу, тем же кодом.
                    RID, которого нет в allocations, резолвится сам, как и раньше:
                    раскладка задаётся только там, где человек её задал.
                    Ручка READ-ONLY: раскладка НЕ сохраняется. Второе нажатие
                    на тот же заказ снова спросит человека — журнала напечатанного
                    у модуля нет и по этому тикету не появляется."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Id заказа поставщику (сделка FbaSrOrder)"
          example: "719944"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemLabelsAllocationRequest'
      responses:
        "200":
          description: "Ссылка на PDF и полная раскладка — как у печати по заказу.
                        Сверх её стопов достижимы ещё три, все про раскладку:
                        allocation_unknown_rid (в allocations пришёл RID, которого
                        в заказе нет), allocation_unknown_mln (листинг не из числа
                        кандидатов этого RID), allocation_mismatch (сумма
                        по RID не сошлась с количеством строки).
                        Все три ОСТАНАВЛИВАЮТ запрос целиком и печатают ничего.
                        Раскладка — прямой ввод человека, и разошедшаяся сумма
                        означает, что экран разъехался с сервером: напечатать
                        «сколько получилось» значило бы наклеить не то число
                        наклеек и узнать об этом уже на Amazon.
                        Значение, на котором споткнулись, едет через двоеточие
                        первым сообщением: 'allocation_unknown_mln: 56-RG9W-ZN5N'."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLabelsResponse'
        "500":
          description: "Непредвиденное исключение со свободным текстом."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

