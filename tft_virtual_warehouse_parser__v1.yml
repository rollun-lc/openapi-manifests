openapi: 3.0.0
info:
  version: "1"
  title: "TftVirtualWarehouseParser"
  description: >
    Live Turn14/TFT virtual inventory read, real portal shipping quote and order execution
    from already paid virtual inventory units.

servers:
  - url: http://tft-parser/openapi/TftVirtualWarehouseParser/v1
  - url: http://host.docker.internal:8081/openapi/TftVirtualWarehouseParser/v1
  - url: http://localhost:8081/openapi/TftVirtualWarehouseParser/v1

tags:
  - name: Inventory
  - name: Quote
  - name: Orders

paths:
  /inventory:
    get:
      tags:
        - Inventory
      summary: "Fetch current inventory"
      parameters:
        - in: query
          name: includeItems
          required: false
          schema:
            type: boolean
            default: true
          description: "When false, returns only live fetch metadata and item_count."
      responses:
        "200":
          description: "Current live inventory"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResult"
        "500":
          description: "Internal error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /quote:
    post:
      tags:
        - Quote
      summary: "Get real shipping options from the portal"
      description: >
        Takes the interprocess cart lock, replays the browser-equivalent portal protocol up
        to the quote step and returns the available shipping options.
        The operation reaches no submission port on any branch and leaves the cart empty.
        Possible response errors: CART_BUSY, CART_MAINTENANCE, PORTAL_LOGIN_FAILED, PORTAL_FAILED
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePostRequest"
      responses:
        "200":
          description: "Shipping options retrieved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResult"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "500":
          description: "Some internal error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /orders:
    post:
      tags:
        - Orders
      summary: "Execute a virtual inventory order or perform a full dry run"
      description: >
        Runs the same reversible path and the same admission policy for a dry run and for real
        execution. The confirm field is required and strictly boolean: false means a full dry run
        in which the submission port is unreachable, true permits exactly one order submission
        after the stop switch is checked again. No step performs an automatic retry.
        The service only consumes virtual inventory units that are already paid for. It never
        populates virtual inventory, so the portal cart flag that replenishes it is never set.
        The required idempotencyKey is stamped on the portal purchase order before the shipment is
        priced, so a repeat of the same request is refused by the portal itself with ALREADY_EXIST
        instead of producing a second order.
        Possible response errors: ALREADY_EXIST, VI_STOCK_INSUFFICIENT, UNKNOWN_CHECKOUT_WAREHOUSE,
        SHIPPING_METHOD_MISMATCH, SHIPPING_COST_LIMIT_EXCEEDED, NON_ZERO_ITEM_TOTAL,
        PAID_STOCK_FALLBACK, STOP_SWITCH_DISABLED, CART_BUSY, CART_MAINTENANCE,
        PORTAL_LOGIN_FAILED, PORTAL_FAILED
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPostRequest"
      responses:
        "200":
          description: "Dry run completed or order confirmed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "500":
          description: "Some internal error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

components:
  schemas:
    ErrorResult:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      description: "Message field is not required"

    Message:
      type: object
      properties:
        level:
          type: string
          description: "Message level, compatible with logger levels"
          enum: [emergency, alert, critical, error, warning, notice, info, debug]
        type:
          type: string
          description: >
            Type of message for client parsing.

            UNDEFINED - Any undefined message type

            LOGGER_MESSAGE - Same as undefined

            LOGIN_FAILED - Could not log into the Turn14 portal

            FETCH_FAILED - Could not load the requested portal page

            HTML_STRUCTURE_CHANGED - The portal page no longer matches the expected structure

            INVENTORY_VALIDATION_FAILED - The parsed inventory failed an integrity check

            INVALID_REQUEST - The request is malformed, for example confirm is missing or not boolean

            VI_STOCK_INSUFFICIENT - At least one line exceeds the available virtual inventory. The whole order is refused; partial fulfillment is not allowed

            UNKNOWN_CHECKOUT_WAREHOUSE - The requested execution warehouse is not one of PA, TX, IN, NV

            SHIPPING_METHOD_MISMATCH - The portal no longer offers the shipping option the caller picked

            SHIPPING_COST_LIMIT_EXCEEDED - Actual shipping cost is above the effective cap

            NON_ZERO_ITEM_TOTAL - The portal charges for the goods, so they are not the already paid virtual inventory units

            PAID_STOCK_FALLBACK - The portal would fill the order from regular paid stock instead of virtual inventory

            CART_BUSY - The shared dealer cart is in use by another operation

            CART_LOCK_UNAVAILABLE - The cart lock file cannot be used, so exclusivity cannot be guaranteed

            CART_MAINTENANCE - Cart automation is disabled for maintenance

            STOP_SWITCH_DISABLED - The order stop switch is off, so no submission is allowed

            PORTAL_LOGIN_FAILED - The portal rejected the login during a cart operation

            PORTAL_FAILED - A portal step failed. The cart is left clean or the failure says it could not be confirmed

            ALREADY_EXIST - The portal already knows this idempotency key as a purchase order number, so the order it identifies exists and must not be placed again
          enum:
            - UNDEFINED
            - LOGGER_MESSAGE
            - LOGIN_FAILED
            - FETCH_FAILED
            - HTML_STRUCTURE_CHANGED
            - INVENTORY_VALIDATION_FAILED
            - INVALID_REQUEST
            - VI_STOCK_INSUFFICIENT
            - UNKNOWN_CHECKOUT_WAREHOUSE
            - SHIPPING_METHOD_MISMATCH
            - SHIPPING_COST_LIMIT_EXCEEDED
            - NON_ZERO_ITEM_TOTAL
            - PAID_STOCK_FALLBACK
            - CART_BUSY
            - CART_LOCK_UNAVAILABLE
            - CART_MAINTENANCE
            - STOP_SWITCH_DISABLED
            - PORTAL_LOGIN_FAILED
            - PORTAL_FAILED
            - ALREADY_EXIST
        text:
          type: string
          description: "Message, that describes what went wrong"

    SuccessResult:
      allOf:
        - $ref: "#/components/schemas/ErrorResult"
      type: object
      properties:
        data:
          type: object

    InventoryResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InventorySnapshot"

    InventorySnapshot:
      type: object
      required:
        - fetched_at
        - source
      properties:
        fetched_at:
          type: string
          description: >
            Moment the portal page was fetched, in UTC.
            The value is an ISO 8601 UTC timestamp. The format keyword is deliberately not
            set: the rollun-openapi date-time validator reads DateTime::getLastErrors() as an
            array, which PHP 8.2 and newer return as false on success, so declaring the format
            makes every response carrying this field fail with a 500.
          example: "2026-06-26T12:18:23Z"
        source:
          type: string
          example: "turn14_virtual_inventory"
          description: Identifier of the page the rows came from
        item_count:
          type: integer
          minimum: 0
          example: 9
          description: Number of parsed items in this read
        validation:
          $ref: "#/components/schemas/ValidationReport"
        items:
          type: array
          items:
            $ref: "#/components/schemas/VirtualInventoryItem"
          description: Parsed positions. Absent when the caller asked for metadata only.

    VirtualInventoryItem:
      type: object
      required:
        - item_id
        - part_number
        - description
        - manufacturer
        - stock_total
        - stock_by_warehouse
        - inventory_date
        - avg_price
        - image
        - reserve_ids
      properties:
        item_id:
          type: string
          description: Portal item code. Used as ItemCode when a line is placed in the cart.
          example: "614715"
        part_number:
          type: string
          description: Manufacturer part number as printed in the portal table
          example: "dun45605418"
        description:
          type: string
          description: Product description as printed in the portal table
          example: "Dunlop D404 Rear Tire - 170/80-15 M/C 77H TL"
        manufacturer:
          type: string
          description: Brand as printed in the portal table
          example: "Dunlop"
        stock_total:
          type: integer
          minimum: 0
          description: >
            Total units reserved for us across all warehouses. Validated against the sum of the
            per warehouse breakdown; a mismatch fails the read instead of being reported silently.
          example: 30
        stock_pa:
          type: integer
          minimum: 0
          example: 0
          description: "Compatibility field for Pennsylvania stock. Zero when missing from the source table."
        stock_tx:
          type: integer
          minimum: 0
          example: 9
          description: "Compatibility field for Texas stock. Zero when missing from the source table."
        stock_in:
          type: integer
          minimum: 0
          example: 9
          description: "Compatibility field for Indiana stock. Zero when missing from the source table."
        stock_nv:
          type: integer
          minimum: 0
          example: 12
          description: "Compatibility field for Nevada stock. Zero when missing from the source table."
        stock_by_warehouse:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          example:
            PA: 0
            TX: 9
            IN: 9
            NV: 12
          description: >
            Units per observed warehouse code. Every raw code seen in the table is preserved,
            including one we do not recognise, so a newly added Turn14 warehouse never silently
            zeroes a read. Only a known code can later become an execution warehouse.
        inventory_date:
          type: string
          example: "04/30/2026"
          description: "Date exactly as shown by the Turn14 portal, expected MM/DD/YYYY."
        avg_price:
          type: number
          minimum: 0
          description: Average unit price we already paid for the reserved units, as shown by the portal
          example: 111.23
        image:
          type: string
          description: Product image URL from the portal
          example: "https://d32vzsop7y1h3k.cloudfront.net/9ec8e3141db598042973201ed948b8fc.JPG"
        reserve_ids:
          type: string
          description: >
            Comma separated portal reservation ids backing this line. Reported as observed and
            not used to address a line, because a line is addressed by item_id and part_number.
          example: "120268,120281,120266,120262"

    ValidationReport:
      type: object
      required:
        - table_rows
        - parsed_items
        - headers_ok
        - stock_totals_ok
        - required_fields_ok
        - server_side_pagination_detected
        - unknown_warehouse_codes
      properties:
        table_rows:
          type: integer
          minimum: 0
          example: 9
          description: Rows discovered in the portal table, counting both accepted and rejected ones
        parsed_items:
          type: integer
          minimum: 0
          example: 9
          description: Rows that became items. Lower than table_rows when a row was rejected.
        headers_ok:
          type: boolean
          example: true
          description: Whether the table header matched what the parser expects
        stock_totals_ok:
          type: boolean
          example: true
          description: Whether every row total matched the sum of its own warehouse breakdown
        aggregate_totals_ok:
          type: boolean
          description: >
            Whether the sum of all row totals matched the sum of every per warehouse value.
            This is the integrity check that keeps a misread table from looking like real stock.
          example: true
        stock_total_sum:
          type: integer
          minimum: 0
          description: Sum of the per row totals across the whole table
          example: 35
        warehouse_stock_sum:
          type: integer
          minimum: 0
          description: Sum of every per warehouse value across the whole table
          example: 35
        max_stock_value:
          type: integer
          minimum: 0
          description: Implausibly large stock limit a row may not exceed
          example: 1000000
        required_fields_ok:
          type: boolean
          example: true
          description: Whether every accepted row carried all required fields
        server_side_pagination_detected:
          type: boolean
          example: false
          description: True when the page hints at more rows than were served, which fails the read instead of returning a partial list
        known_warehouse_codes:
          type: array
          items:
            type: string
          example: [PA, TX, IN, NV]
          description: Warehouse codes the parser recognises
        unknown_warehouse_codes:
          type: array
          items:
            type: string
          example: []
          description: Observed codes the parser does not recognise. Reported, never silently dropped.
        warnings:
          type: array
          items:
            type: string
          example: []
          description: Non fatal observations collected during the read

    ## Autopurchase resources

    Item:
      type: object
      required:
        - itemId
        - partNumber
        - quantity
      properties:
        itemId:
          type: integer
          description: Numeric catalog item id
          example: 614813
        partNumber:
          type: string
          description: >
            Part number from the catalog. The itemId and partNumber pair is verified as one
            identity and is never guessed from a portal search.
          example: dun45067704
        quantity:
          type: integer
          description: Quantity of products. Carried in full; partial fulfillment is not allowed.
          example: 1

    Customer:
      type: object
      description: >
        Recipient of the shipment. Fields mirror the portal cart address form one to one, so
        nothing here has to be invented or dropped at the portal boundary. The portal form has
        no email field, so this contract has none either.
      required:
        - name
        - address
      properties:
        name:
          type: string
          maxLength: 35
          description: Contact name. Maps to the portal contact field, which truncates above 35 characters.
          example: David Ellison
        company:
          type: string
          nullable: true
          maxLength: 35
          description: Company name. Maps to the portal company field.
          example: RPM Cycles
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: Phone number to reach the person. Maps to the portal phone field.
          example: "310-876-9191"
        address:
          $ref: "#/components/schemas/Address"

    Address:
      type: object
      description: >
        Postal address in the exact shape the portal cart form accepts. The length limits are
        the portal's own maxlength values, so an address that passes this schema is accepted
        by the portal without truncation.
      required:
        - country
        - state
        - city
        - postalCode
        - address1
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Two letter country code. Maps to the portal country select.
          example: US
        state:
          type: string
          maxLength: 21
          description: >
            US state code or Canadian province code. Maps to the portal state-us or state-ca
            select depending on the country.
          example: CA
        city:
          type: string
          maxLength: 30
          description: Full city name. Maps to the portal city field.
          example: LOS ANGELES
        postalCode:
          type: string
          maxLength: 13
          description: ZIP or postal code. Maps to the portal zip_code field.
          example: "90066"
        address1:
          type: string
          maxLength: 35
          description: First line of the address. Maps to the portal address_one field.
          example: 3224 MAPLEWOOD AVE
        address2:
          type: string
          nullable: true
          maxLength: 35
          description: Second line of the address. Maps to the portal address_two field.
          example: "Suite 200"

    ShippingOption:
      type: object
      properties:
        shippingMethodKey:
          type: string
          description: >
            Normalized opaque identity of a portal shipping option. Comparable only with a fresh
            quote for the same request tuple. The caller picks the option; the service never does.
          example: "ups_ground"
        carrier:
          type: string
          nullable: true
          description: The name of the carrier handling the shipment
          example: FedEx
        service:
          type: string
          nullable: true
          description: Carrier service level as reported by the portal
          example: Ground Home Delivery
        transitTime:
          type: string
          nullable: true
          description: Portal transit time string as is. Absolute dates are never invented from it.
          example: "2 Business Days"
        costUsd:
          type: number
          description: Shipping cost for this option
          example: 12.45

    ## Autopurchase requests

    QuotePostRequest:
      type: object
      required:
        - items
        - checkoutWarehouse
        - receiver
      properties:
        items:
          type: array
          description: List of items to quote
          items:
            $ref: "#/components/schemas/Item"
        checkoutWarehouse:
          type: string
          description: >
            Execution warehouse. Closed set: an observed warehouse code is preserved by the
            inventory read but does not automatically become an execution warehouse. The portal
            groups a shipment by its own numeric id, for example 59 for NV.
          example: NV
          enum:
            - PA
            - TX
            - IN
            - NV
        receiver:
          $ref: "#/components/schemas/Customer"

    OrderPostRequest:
      type: object
      required:
        - idempotencyKey
        - items
        - checkoutWarehouse
        - receiver
        - shippingMethodKey
        - maxShippingCostUsd
        - confirm
      properties:
        idempotencyKey:
          type: string
          maxLength: 100
          description: >
            An idempotency key is a unique value generated by the client which the server uses to
            recognize subsequent retries of the same request. How you create unique keys is up to you.
            The service writes it into the portal's Purchase Order # field, which is the same anchor
            the Turn14 API path uses, and the portal itself refuses a purchase order number it has
            already seen. A dry run carries the key too, so it rehearses that refusal without
            creating anything. The portal limits the field to 100 characters.
          example: "tft-vi-2026-09-07-0001"
        items:
          type: array
          description: List of items to order
          items:
            $ref: "#/components/schemas/Item"
        checkoutWarehouse:
          type: string
          description: >
            Execution warehouse. Closed set: an observed warehouse code is preserved by the
            inventory read but does not automatically become an execution warehouse. The portal
            groups a shipment by its own numeric id, for example 59 for NV.
          example: NV
          enum:
            - PA
            - TX
            - IN
            - NV
        receiver:
          $ref: "#/components/schemas/Customer"
        shippingMethodKey:
          type: string
          description: Option key the caller picked from a fresh quote for the same request tuple
          example: "ups_ground"
        maxShippingCostUsd:
          type: number
          description: >
            Caller limit for shipping only. The effective cap is min(maxShippingCostUsd, 50).
            Item price is always zero because the goods are already paid for.
          example: 50
        confirm:
          type: boolean
          description: >
            Required and strictly boolean. A missing or non-boolean value is rejected before any
            portal call. Only false means a dry run, only true permits a submission.

    ## Autopurchase results

    QuoteData:
      type: object
      properties:
        checkoutWarehouse:
          type: string
          description: >
            Execution warehouse. Closed set: an observed warehouse code is preserved by the
            inventory read but does not automatically become an execution warehouse. The portal
            groups a shipment by its own numeric id, for example 59 for NV.
          example: NV
          enum:
            - PA
            - TX
            - IN
            - NV
        options:
          type: array
          description: Shipping options offered by the portal for this request
          items:
            $ref: "#/components/schemas/ShippingOption"

    QuoteResult:
      allOf:
        - $ref: "#/components/schemas/ErrorResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/QuoteData"

    OrderData:
      type: object
      properties:
        idempotencyKey:
          type: string
          description: The key the service stamped on the portal purchase order for this request
          example: "tft-vi-2026-09-07-0001"
        outcome:
          type: string
          description: >
            A dry run is distinguished from a real execution by this field, not by text.
            DRY_RUN - the full reversible path ran and no order was created
            ORDER_CONFIRMED - the portal returned an order id
          enum:
            - DRY_RUN
            - ORDER_CONFIRMED
        submitted:
          type: boolean
          description: Whether an order submission actually happened
        orderId:
          type: string
          nullable: true
          description: Turn14 order id. Non-null only for ORDER_CONFIRMED.
          example: "1234567"
        checkoutWarehouse:
          type: string
          description: >
            Execution warehouse. Closed set: an observed warehouse code is preserved by the
            inventory read but does not automatically become an execution warehouse. The portal
            groups a shipment by its own numeric id, for example 59 for NV.
          example: NV
          enum:
            - PA
            - TX
            - IN
            - NV
        items:
          type: array
          description: Lines the service accounted for
          items:
            $ref: "#/components/schemas/Item"
        shippingMethodKey:
          type: string
          description: The option key that was actually used
          example: "ups_ground"
        itemTotalUsd:
          type: number
          description: Always 0 - the goods are already paid for and only shipping is charged
          example: 0
        shippingCostUsd:
          type: number
          description: Actual shipping cost of the chosen option
          example: 12.45

    OrderResult:
      allOf:
        - $ref: "#/components/schemas/ErrorResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OrderData"
