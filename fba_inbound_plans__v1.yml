          type: array
          items:
            $ref: "#/components/schemas/TransportationOption"
        pagination:
          $ref: "#/components/schemas/Pagination"

    TransportationOption:
      type: object
      description: "A carrier offer for one shipment."
      properties:
        transportationOptionId:
          type: string
          nullable: true
          example: "tof61cf5c4-75c7-4670-88f6-3c6d0a9f5c7a"
        shipmentId:
          type: string
          nullable: true
          example: "shdc4f24ef-1b24-4031-8afa-2922386b845e"
        shippingMode:
          type: string
          nullable: true
          example: "GROUND_SMALL_PARCEL"
        shippingSolution:
          type: string
          nullable: true
          example: "AMAZON_PARTNERED_CARRIER"
