openapi: 3.0.0
info:
  version: "1"
  title: "FbaInboundPlans"
  description: |
    Creates and drives Amazon FBA inbound plans. Every endpoint proxies one SP-API Fulfillment
    Inbound 2024-03-20 operation: the path repeats Amazon's path under `/inbound/fba/2024-03-20`,
    except `/prepDetails` (Amazon's `/items/prepDetails`), and the `operationId` is Amazon's
    operation name. The module stores nothing and never waits:
    the caller owns the order of the steps, the polling of operations and the paging.

    ### Asynchronous operations

    Every POST and PUT starts an asynchronous Amazon operation and returns its `operationId` at
    once. Poll `GET /operations/{operationId}` until `operationStatus` is `SUCCESS` or `FAILED`.
    The problems Amazon found - errors and warnings, for example `FBA_INB_0180` "Expiration date
    required" - are in `operationProblems` of that answer, not in an error of the starting call.

    ### Paging

    A list endpoint returns one Amazon page. When `data.pagination.nextToken` is set, call again
    with the same parameters plus `paginationToken`; stop when `pagination` or its `nextToken`
    is null. Amazon decides the page size within `pageSize`.

    ### What the data means

    - `data` is Amazon's answer with Amazon's field names. A field Amazon does not send is null
      or absent.
    - Values Amazon may extend - statuses, carriers, prep types, problem codes - are plain
      strings in answers, not enums.
    - Dates are ISO-8601 strings exactly as Amazon sends them, with or without seconds.
    - In a request, an optional field sent as null is the same as a field left out: nulls never
      reach Amazon.
    - Only small parcel delivery is covered. Pallet, freight, less-than-truckload, self-ship and
      custom placement fields are not passed in either direction.

    ### Errors

    A body that is not JSON is answered with HTTP 400, a body sent with another Content-Type
    with HTTP 415; both answers are empty and Amazon is not called. Every other failure is HTTP
    500 with `messages[0].level = error`, and there are two shapes of `messages[0].text`:

    1. **Type level violation** - a parameter or a body field of the wrong type, outside its
       range or enum, or a missing required field is rejected before Amazon is called. That text
       carries **no machine code**, it reads `Request validation failed. Details: ...`.
    2. **Business stop** - the text starts with a machine code, then a human readable part:
       - `invalid_id` - a path parameter is not an Amazon identifier: 1 to 64 letters, digits
         and `-`
       - `invalid_mskus` - `mskus` of `GET /prepDetails` is empty, has an empty element or
         more than 100 MSKUs
       - `missing_filter` - `GET /inboundPlans/{inboundPlanId}/transportationOptions` has
         neither `placementOptionId` nor `shipmentId`
       - `amazon_error` - Amazon refused the request with HTTP 4xx other than 429, so the
         operation did not run. The HTTP status and Amazon's messages follow, for example
         `amazon_error: [400] ERROR: DateTime value '2026-11-12T00:00:00Z' cannot be in the past.`
       - `amazon_throttled` - Amazon answered 429, the operation did not run. The endpoint
         never retries by itself.
       - `amazon_unavailable` - the outcome is unknown. Amazon answered 5xx, did not answer in
         time, answered with an unreadable body or accepted a write without an `operationId`, or
         the access token could not be obtained. A write operation may have run: read the state
         before repeating it.

    Any other text without a machine code - for example a `Response validation failed` of an
    answer Amazon sent in an unexpected shape - means the same as `amazon_unavailable`.

    ### Rate limits

    Amazon limits every operation per seller account. A spent limit is `amazon_throttled`; the
    endpoints neither queue nor retry, the caller paces its calls.

    ### Access

    The module is reachable only inside the service network: its servers have no rollun.net
    address, so the rollun.net gateway does not route to it. The confirmations of placement
    and transportation spend money and are called by service-crm only.

servers:
  - url: http://amz-orders-ngx/openapi/FbaInboundPlans/v1
  - url: http://host.docker.internal:8280/openapi/FbaInboundPlans/v1
  - url: http://localhost:8280/openapi/FbaInboundPlans/v1

tags:
  - name: PrepDetails
    description: "Prep and label requirements of items"
  - name: InboundPlans
    description: "Inbound plans and everything inside them: packing, placement, shipments, transportation, delivery windows"
  - name: Operations
    description: "Results of asynchronous operations"

paths:
  /prepDetails:
    get:
      tags:
        - PrepDetails
      operationId: listPrepDetails
      summary: "Read the prep and label requirements of MSKUs"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/items/prepDetails` (`listPrepDetails`).

        For every MSKU Amazon knows it returns the prep category, the prep types and who may
        prep and label the item: `prepOwnerConstraint` and `labelOwnerConstraint`
        (`AMAZON_ONLY`, `NONE_ONLY`, `SELLER_ONLY`). An inbound plan whose `prepOwner` or
        `labelOwner` contradicts these constraints is refused by Amazon. An MSKU Amazon does
        not know is simply missing from the answer.

        `%` and `+` inside an MSKU are encoded twice before the call, as Amazon requires. An MSKU
        with a comma cannot be asked for: the comma separates the MSKUs.

        The path is `/prepDetails`, not Amazon's `/items/prepDetails`: the tag of an endpoint is the
        first segment of its path, and the tag `Items` belongs to another module of this service.
      parameters:
        - in: query
          name: marketplaceId
          description: "The marketplace, `ATVPDKIKX0DER` for the US."
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 20
            example: "ATVPDKIKX0DER"
        - in: query
          name: mskus
          description: "MSKUs separated by commas, from 1 to 100. Blanks around a comma are dropped."
          required: true
          schema:
            type: string
            minLength: 1
            example: "KZBCZfba,F14U4fba,32-X3TL-V9BP"
      responses:
        "200":
          description: "Prep details of the MSKUs Amazon knows."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPrepDetailsResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans:
    post:
      tags:
        - InboundPlans
      operationId: createInboundPlan
      summary: "Create an inbound plan"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans` (`createInboundPlan`).

        Returns `inboundPlanId` and `operationId` at once; the plan is ready when the operation
        is `SUCCESS`. When the operation is `FAILED` the plan stays in Amazon with status
        `ERRORED`, and the reasons are in `operationProblems`. For example, an item with an
        expiration date but without `expiration` fails with `FBA_INB_0180` "Expiration date
        required" (live trial 2026-11-12).

        `name` is required here, unlike in Amazon: a plan whose answer was lost can only be
        found by its name, see `GET /inboundPlans`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInboundPlanRequest"
      responses:
        "200":
          description: "The plan id and the operation that creates the plan."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInboundPlanResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    get:
      tags:
        - InboundPlans
      operationId: listInboundPlans
      summary: "List inbound plans with minimal information"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans` (`listInboundPlans`).

        Amazon cannot filter by name. To find a plan by its name, page through plans with
        `status=ACTIVE`, `sortBy=CREATION_TIME` and `sortOrder=DESC`, and compare `name`.
      parameters:
        - in: query
          name: pageSize
          description: "Plans per page, 1 to 30. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            example: 30
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
        - in: query
          name: status
          description: "Only plans in this status."
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - VOIDED
              - SHIPPED
            example: "ACTIVE"
        - in: query
          name: sortBy
          description: "Sort field."
          required: false
          schema:
            type: string
            enum:
              - LAST_UPDATED_TIME
              - CREATION_TIME
            example: "CREATION_TIME"
        - in: query
          name: sortOrder
          description: "Sort order."
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            example: "DESC"
      responses:
        "200":
          description: "One page of plans."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInboundPlansResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}:
    get:
      tags:
        - InboundPlans
      operationId: getInboundPlan
      summary: "Read an inbound plan"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}` (`getInboundPlan`).

        The plan status is `ACTIVE`, `VOIDED`, `SHIPPED` or `ERRORED`. A plan voided in Send to
        Amazon or by Amazon itself reads `VOIDED`. The answer lists the packing options,
        placement options and shipments of the plan with their statuses.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      responses:
        "200":
          description: "The plan."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundPlanResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/cancellation:
    put:
      tags:
        - InboundPlans
      operationId: cancelInboundPlan
      summary: "Cancel an inbound plan"
      description: |
        Proxies `PUT /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/cancellation`
        (`cancelInboundPlan`). The plan becomes `VOIDED` when the operation succeeds.

        Amazon cancels a plan before and after the placement is confirmed. After the
        confirmation it is free only within the void window of the carrier (24 hours for small
        parcels); later Amazon may charge.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      responses:
        "200":
          description: "The operation that cancels the plan."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/packingOptions:
    post:
      tags:
        - InboundPlans
      operationId: generatePackingOptions
      summary: "Generate packing options"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/packingOptions`
        (`generatePackingOptions`). When the operation succeeds, read the options with
        `GET .../packingOptions`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      responses:
        "200":
          description: "The operation that generates the packing options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    get:
      tags:
        - InboundPlans
      operationId: listPackingOptions
      summary: "List the packing options of a plan"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/packingOptions`
        (`listPackingOptions`).

        A packing option splits the items of the plan into packing groups: the items of one
        group may share a box, items of different groups may not. An option is `OFFERED` until
        one is confirmed, the confirmed one is `ACCEPTED`. `fees` and `discounts` are the money
        of the option; `supportedShippingConfigurations` and `supportedConfigurations` tell which
        delivery it allows, for example `GROUND_SMALL_PARCEL` with `AMAZON_PARTNERED_CARRIER`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: query
          name: pageSize
          description: "Options per page, 1 to 20. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            example: 20
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of packing options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPackingOptionsResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/packingOptions/{packingOptionId}/confirmation:
    post:
      tags:
        - InboundPlans
      operationId: confirmPackingOption
      summary: "Confirm a packing option"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/packingOptions/{packingOptionId}/confirmation`
        (`confirmPackingOption`). Amazon charges the `fees` of the option, if it has any.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: packingOptionId
          description: "The packing option to confirm."
          required: true
          schema:
            type: string
            example: "po6c032884-542a-4802-bfbb-d8f3b745b139"
      responses:
        "200":
          description: "The operation that confirms the packing option."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/packingGroups/{packingGroupId}/items:
    get:
      tags:
        - InboundPlans
      operationId: listPackingGroupItems
      summary: "List the items of a packing group"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/packingGroups/{packingGroupId}/items`
        (`listPackingGroupItems`). Shows which items Amazon put into the group, with their
        FNSKU, ASIN and prep instructions. Available after the packing options are generated.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: packingGroupId
          description: "The packing group, one of `packingGroups` of a packing option."
          required: true
          schema:
            type: string
            example: "pgabd0c44a-5ed1-4f35-b9f5-eb1eabbd28b7"
        - in: query
          name: pageSize
          description: "Items per page, 1 to 100. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 100
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of items."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPackingGroupItemsResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/packingGroups/{packingGroupId}/boxes:
    get:
      tags:
        - InboundPlans
      operationId: listPackingGroupBoxes
      summary: "List the boxes of a packing group"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/packingGroups/{packingGroupId}/boxes`
        (`listPackingGroupBoxes`). The boxes Amazon stored from `POST .../packingInformation`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: packingGroupId
          description: "The packing group."
          required: true
          schema:
            type: string
            example: "pgabd0c44a-5ed1-4f35-b9f5-eb1eabbd28b7"
        - in: query
          name: pageSize
          description: "Boxes per page, 1 to 100. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 100
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of boxes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBoxesResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/packingInformation:
    post:
      tags:
        - InboundPlans
      operationId: setPackingInformation
      summary: "Set the boxes and their contents"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/packingInformation`
        (`setPackingInformation`).

        One `packageGroupings` element per packing group: its boxes with weight, dimensions
        and, for `BOX_CONTENT_PROVIDED`, the items of every box. A box carries items of one
        packing group only. Calling it again before the placement is confirmed replaces the boxes
        of the plan. After the confirmation Amazon takes boxes only per shipment (`shipmentId`),
        which this contract does not pass: the boxes are fixed by then.

        The operation may succeed with warnings, for example `FBA_INB_0165` (box weight below
        the expected minimum) and `FBA_INB_0166` (box volume below the expected minimum) - they
        are in `operationProblems` with severity `WARNING` (live trial 2026-11-12).
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPackingInformationRequest"
      responses:
        "200":
          description: "The operation that sets the boxes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/placementOptions:
    post:
      tags:
        - InboundPlans
      operationId: generatePlacementOptions
      summary: "Generate placement options"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/placementOptions`
        (`generatePlacementOptions`) without custom placement. When the operation succeeds,
        read the options with `GET .../placementOptions`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      responses:
        "200":
          description: "The operation that generates the placement options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    get:
      tags:
        - InboundPlans
      operationId: listPlacementOptions
      summary: "List the placement options of a plan"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/placementOptions`
        (`listPlacementOptions`).

        A placement option is a set of shipments, each to one Amazon warehouse. `fees` minus
        `discounts` is the placement fee of the option. The option expires at `expiration`. An
        option is `OFFERED` until one is confirmed, the confirmed one is `ACCEPTED`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: query
          name: pageSize
          description: "Options per page, 1 to 20. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            example: 20
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of placement options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlacementOptionsResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/placementOptions/{placementOptionId}/confirmation:
    post:
      tags:
        - InboundPlans
      operationId: confirmPlacementOption
      summary: "Confirm a placement option - spends money"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/placementOptions/{placementOptionId}/confirmation`
        (`confirmPlacementOption`).

        Accepts the placement fee of the option and fixes the shipments and their warehouses;
        the placement of the plan cannot be changed afterwards. The other options of the plan
        are discarded by Amazon.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: placementOptionId
          description: "The placement option to confirm."
          required: true
          schema:
            type: string
            example: "pld344a3f5-59f2-432c-910e-0e0500dff24b"
      responses:
        "200":
          description: "The operation that confirms the placement option."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/shipments/{shipmentId}:
    get:
      tags:
        - InboundPlans
      operationId: getShipment
      summary: "Read a shipment"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/shipments/{shipmentId}`
        (`getShipment`).

        `destination.warehouseId` is the Amazon warehouse, for example `ABQ2`.
        `shipmentConfirmationId` is the shipment ID that Seller Central shows (`FBA...`); it
        appears once the placement is confirmed. `selectedTransportationOptionId` is set once
        the transportation is confirmed.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: shipmentId
          description: "The shipment, one of `shipmentIds` of a placement option."
          required: true
          schema:
            type: string
            example: "shdc4f24ef-1b24-4031-8afa-2922386b845e"
      responses:
        "200":
          description: "The shipment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/shipments/{shipmentId}/boxes:
    get:
      tags:
        - InboundPlans
      operationId: listShipmentBoxes
      summary: "List the boxes of a shipment"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/shipments/{shipmentId}/boxes`
        (`listShipmentBoxes`). `boxId` is the box label ID, `FBA...U000001` and so on.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: shipmentId
          description: "The shipment."
          required: true
          schema:
            type: string
            example: "shdc4f24ef-1b24-4031-8afa-2922386b845e"
        - in: query
          name: pageSize
          description: "Boxes per page, 1 to 1000. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            example: 1000
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of boxes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBoxesResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/transportationOptions:
    post:
      tags:
        - InboundPlans
      operationId: generateTransportationOptions
      summary: "Generate transportation options for a placement option"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/transportationOptions`
        (`generateTransportationOptions`). One call per placement option, with a configuration
        for each of its shipments.

        `readyToShipWindow.start` must not be in the past: Amazon refuses midnight of today with
        `DateTime value ... cannot be in the past` (live trial 2026-11-12). Without pallet data
        the operation carries a warning that less-than-truckload options may be missing; that is
        expected for small parcels.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTransportationOptionsRequest"
      responses:
        "200":
          description: "The operation that generates the transportation options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    get:
      tags:
        - InboundPlans
      operationId: listTransportationOptions
      summary: "List the transportation options of a placement option or a shipment"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/transportationOptions`
        (`listTransportationOptions`). Give `placementOptionId`, `shipmentId` or both.

        The Amazon partnered carrier for small parcels is `shippingSolution`
        `AMAZON_PARTNERED_CARRIER` with `shippingMode` `GROUND_SMALL_PARCEL`, carrier `UPSN`,
        and only it has a `quote`. It may be on any page: in the live trial of 2026-11-12 there
        were 25 to 26 options per placement option over two pages.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: query
          name: placementOptionId
          description: "Options of every shipment of this placement option."
          required: false
          schema:
            type: string
            example: "pld344a3f5-59f2-432c-910e-0e0500dff24b"
        - in: query
          name: shipmentId
          description: "Options of this shipment."
          required: false
          schema:
            type: string
            example: "shdc4f24ef-1b24-4031-8afa-2922386b845e"
        - in: query
          name: pageSize
          description: "Options per page, 1 to 20. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            example: 20
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of transportation options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransportationOptionsResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/transportationOptions/confirmation:
    post:
      tags:
        - InboundPlans
      operationId: confirmTransportationOptions
      summary: "Confirm transportation options - spends money"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/transportationOptions/confirmation`
        (`confirmTransportationOptions`). One selection per shipment of the confirmed placement
        option. Accepts the quote of the partnered carrier.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTransportationOptionsRequest"
      responses:
        "200":
          description: "The operation that confirms the transportation options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/shipments/{shipmentId}/deliveryWindowOptions:
    post:
      tags:
        - InboundPlans
      operationId: generateDeliveryWindowOptions
      summary: "Generate delivery window options of a shipment"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/shipments/{shipmentId}/deliveryWindowOptions`
        (`generateDeliveryWindowOptions`). Needed when a transportation option has the
        precondition `CONFIRMED_DELIVERY_WINDOW`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: shipmentId
          description: "The shipment."
          required: true
          schema:
            type: string
            example: "shc75b251d-761f-4474-a851-fbbf6eaa1ac4"
      responses:
        "200":
          description: "The operation that generates the delivery window options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    get:
      tags:
        - InboundPlans
      operationId: listDeliveryWindowOptions
      summary: "List the delivery window options of a shipment"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/shipments/{shipmentId}/deliveryWindowOptions`
        (`listDeliveryWindowOptions`). An option can be confirmed while `availabilityType` is
        `AVAILABLE` and until `validUntil`.
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: shipmentId
          description: "The shipment."
          required: true
          schema:
            type: string
            example: "shc75b251d-761f-4474-a851-fbbf6eaa1ac4"
        - in: query
          name: pageSize
          description: "Options per page, 1 to 100. Amazon's default is 10."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 100
        - in: query
          name: paginationToken
          description: "`data.pagination.nextToken` of the previous page."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "One page of delivery window options."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeliveryWindowOptionsResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /inboundPlans/{inboundPlanId}/shipments/{shipmentId}/deliveryWindowOptions/{deliveryWindowOptionId}/confirmation:
    post:
      tags:
        - InboundPlans
      operationId: confirmDeliveryWindowOptions
      summary: "Confirm a delivery window of a shipment"
      description: |
        Proxies `POST /inbound/fba/2024-03-20/inboundPlans/{inboundPlanId}/shipments/{shipmentId}/deliveryWindowOptions/{deliveryWindowOptionId}/confirmation`
        (`confirmDeliveryWindowOptions`).
      parameters:
        - in: path
          name: inboundPlanId
          description: "The inbound plan."
          required: true
          schema:
            type: string
            example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        - in: path
          name: shipmentId
          description: "The shipment."
          required: true
          schema:
            type: string
            example: "shc75b251d-761f-4474-a851-fbbf6eaa1ac4"
        - in: path
          name: deliveryWindowOptionId
          description: "The delivery window option to confirm."
          required: true
          schema:
            type: string
            example: "2c111bac-d579-4a02-a597-c92a89248f3f"
      responses:
        "200":
          description: "The operation that confirms the delivery window."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /operations/{operationId}:
    get:
      tags:
        - Operations
      operationId: getInboundOperationStatus
      summary: "Read the result of an asynchronous operation"
      description: |
        Proxies `GET /inbound/fba/2024-03-20/operations/{operationId}` (`getInboundOperationStatus`).

        `operationStatus` is `IN_PROGRESS`, `SUCCESS` or `FAILED`. `operationProblems` holds
        the problems Amazon found: `severity` `ERROR` or `WARNING`, a `code` such as
        `FBA_INB_0180`, a `message` and `details` naming the resource, for example
        `There's an input error with the resource 'X8LPVfba'.`. A `SUCCESS` may carry warnings.
      parameters:
        - in: path
          name: operationId
          description: "The operation, `operationId` of the call that started it."
          required: true
          schema:
            type: string
            example: "e18e4319-3c26-4a73-b9e2-45969b8c66f7"
      responses:
        "200":
          description: "The state of the operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundOperationStatusResult"
        "500":
          description: "An error, see the shapes of `messages[0].text` in the API description."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

components:
  schemas:
    # ---------------------------------------------------------------- requests

    CreateInboundPlanRequest:
      type: object
      description: "A new inbound plan."
      required:
        - destinationMarketplaces
        - items
        - name
        - sourceAddress
      properties:
        destinationMarketplaces:
          type: array
          description: "Exactly one marketplace, `ATVPDKIKX0DER` for the US."
          items:
            type: string
            minLength: 1
            maxLength: 20
            example: "ATVPDKIKX0DER"
        items:
          type: array
          description: "Items of the plan, 1 to 2000, one line per MSKU."
          items:
            $ref: "#/components/schemas/ItemInput"
        name:
          type: string
          description: "Name of the plan, unique for the caller, for example `CRM-736332-1`. Required here, unlike in Amazon."
          minLength: 1
          maxLength: 40
          example: "CRM-736332-1"
        sourceAddress:
          $ref: "#/components/schemas/AddressInput"

    ItemInput:
      type: object
      description: "An item of a plan or a box."
      required:
        - msku
        - quantity
        - prepOwner
        - labelOwner
      properties:
        msku:
          type: string
          description: "Seller SKU."
          minLength: 1
          maxLength: 255
          example: "BZRIUfba1"
        quantity:
          type: integer
          description: "Units of the MSKU."
          minimum: 1
          maximum: 500000
          example: 7
        prepOwner:
          type: string
          description: "Who preps the item. Must fit `prepOwnerConstraint` of `GET /prepDetails`."
          enum:
            - AMAZON
            - SELLER
            - NONE
          example: "NONE"
        labelOwner:
          type: string
          description: "Who labels the item. Must fit `labelOwnerConstraint` of `GET /prepDetails`."
          enum:
            - AMAZON
            - SELLER
            - NONE
          example: "SELLER"
        expiration:
          type: string
          nullable: true
          description: "Expiration date, `YYYY-MM-DD`. Required by Amazon for items with an expiration date."
          pattern: "^([0-9]{4})-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])$"
          example: "2027-08-19"
        manufacturingLotCode:
          type: string
          nullable: true
          description: "Manufacturing lot code."
          minLength: 1
          maxLength: 256

    AddressInput:
      type: object
      description: "The address the boxes ship from."
      required:
        - addressLine1
        - city
        - countryCode
        - name
        - phoneNumber
        - postalCode
      properties:
        addressLine1:
          type: string
          minLength: 1
          maxLength: 180
          example: "5327 Aldine Mail Route"
        addressLine2:
          type: string
          nullable: true
          minLength: 1
          maxLength: 60
        city:
          type: string
          minLength: 1
          maxLength: 30
          example: "Houston"
        companyName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        countryCode:
          type: string
          description: "ISO 3166-1 alpha-2."
          pattern: "^[A-Z]{2}$"
          example: "US"
        districtOrCounty:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        email:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1024
        name:
          type: string
          description: "Name of the contact person."
          minLength: 1
          maxLength: 50
          example: "Natalia Shoptimistic"
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: "19299991780"
        postalCode:
          type: string
          minLength: 1
          maxLength: 32
          example: "77039"
        stateOrProvinceCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          example: "TX"

    SetPackingInformationRequest:
      type: object
      description: "Boxes of a plan, grouped by packing group."
      required:
        - packageGroupings
      properties:
        packageGroupings:
          type: array
          description: "One element per packing group of the confirmed packing option."
          items:
            $ref: "#/components/schemas/PackageGroupingInput"

    PackageGroupingInput:
      type: object
      description: "The boxes of one packing group."
      required:
        - packingGroupId
        - boxes
      properties:
        packingGroupId:
          type: string
          description: "The packing group the boxes belong to."
          minLength: 38
          maxLength: 38
          example: "pgabd0c44a-5ed1-4f35-b9f5-eb1eabbd28b7"
        boxes:
          type: array
          description: "Boxes of the group, 1 to 5000."
          items:
            $ref: "#/components/schemas/BoxInput"

    BoxInput:
      type: object
      description: "A box: or several identical boxes when `quantity` is above 1."
      required:
        - contentInformationSource
        - dimensions
        - weight
        - quantity
      properties:
        contentInformationSource:
          type: string
          description: "How Amazon learns the contents. `BOX_CONTENT_PROVIDED` requires `items`."
          enum:
            - BOX_CONTENT_PROVIDED
            - MANUAL_PROCESS
            - BARCODE_2D
          example: "BOX_CONTENT_PROVIDED"
        dimensions:
          $ref: "#/components/schemas/DimensionsInput"
        weight:
          $ref: "#/components/schemas/WeightInput"
        quantity:
          type: integer
          description: "Number of identical boxes."
          minimum: 1
          maximum: 10000
          example: 1
        items:
          type: array
          nullable: true
          description: "Contents of one box."
          items:
            $ref: "#/components/schemas/ItemInput"

    DimensionsInput:
      type: object
      description: "Dimensions of a box."
      required:
        - length
        - width
        - height
        - unitOfMeasurement
      properties:
        length:
          type: number
          minimum: 0
          maximum: 100000
          example: 11
        width:
          type: number
          minimum: 0
          maximum: 100000
          example: 9
        height:
          type: number
          minimum: 0
          maximum: 100000
          example: 12
        unitOfMeasurement:
          type: string
          enum:
            - IN
            - CM
          example: "IN"

    WeightInput:
      type: object
      description: "Weight of a box."
      required:
        - value
        - unit
      properties:
        value:
          type: number
          minimum: 0
          maximum: 100000
          example: 24
        unit:
          type: string
          enum:
            - LB
            - KG
          example: "LB"

    GenerateTransportationOptionsRequest:
      type: object
      description: "What to generate transportation options for."
      required:
        - placementOptionId
        - shipmentTransportationConfigurations
      properties:
        placementOptionId:
          type: string
          description: "The placement option whose shipments get the options."
          minLength: 38
          maxLength: 38
          example: "pld344a3f5-59f2-432c-910e-0e0500dff24b"
        shipmentTransportationConfigurations:
          type: array
          description: "One configuration per shipment of the placement option."
          items:
            $ref: "#/components/schemas/ShipmentTransportationConfigurationInput"

    ShipmentTransportationConfigurationInput:
      type: object
      description: "Transportation settings of one shipment."
      required:
        - shipmentId
        - readyToShipWindow
      properties:
        shipmentId:
          type: string
          minLength: 38
          maxLength: 38
          example: "shdc4f24ef-1b24-4031-8afa-2922386b845e"
        readyToShipWindow:
          $ref: "#/components/schemas/WindowInput"
        contactInformation:
          $ref: "#/components/schemas/ContactInformationInput"

    WindowInput:
      type: object
      description: "When the boxes are ready to ship."
      required:
        - start
      properties:
        start:
          type: string
          description: "ISO-8601 date-time, not in the past."
          minLength: 1
          example: "2026-11-12T17:05:19Z"

    ContactInformationInput:
      type: object
      description: "A contact for the carrier."
      required:
        - name
        - phoneNumber
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1024

    ConfirmTransportationOptionsRequest:
      type: object
      description: "The transportation option chosen for every shipment."
      required:
        - transportationSelections
      properties:
        transportationSelections:
          type: array
          description: "One selection per shipment."
          items:
            $ref: "#/components/schemas/TransportationSelectionInput"

    TransportationSelectionInput:
      type: object
      description: "The transportation option of one shipment."
      required:
        - shipmentId
        - transportationOptionId
      properties:
        shipmentId:
          type: string
          minLength: 38
          maxLength: 38
          example: "shdc4f24ef-1b24-4031-8afa-2922386b845e"
        transportationOptionId:
          type: string
          minLength: 38
          maxLength: 38
          example: "tof61cf5c4-75c7-4670-88f6-3c6d0a9f5c7a"
        contactInformation:
          $ref: "#/components/schemas/ContactInformationInput"

    # ---------------------------------------------------------------- results

    ListPrepDetailsResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PrepDetailsPage"

    CreateInboundPlanResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CreatedInboundPlan"

    OperationResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OperationReference"

    ListInboundPlansResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InboundPlansPage"

    InboundPlanResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InboundPlan"

    ListPackingOptionsResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PackingOptionsPage"

    ListPackingGroupItemsResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ItemsPage"

    ListBoxesResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/BoxesPage"

    ListPlacementOptionsResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PlacementOptionsPage"

    ShipmentResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Shipment"

    ListTransportationOptionsResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TransportationOptionsPage"

    ListDeliveryWindowOptionsResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DeliveryWindowOptionsPage"

    InboundOperationStatusResult:
      allOf:
        - $ref: "#/components/schemas/SuccessResult"
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InboundOperationStatus"

    # ---------------------------------------------------------------- Amazon answers

    OperationReference:
      type: object
      description: "An asynchronous operation Amazon started."
      properties:
        operationId:
          type: string
          nullable: true
          description: "Poll it with `GET /operations/{operationId}`."
          example: "a84158c8-b21b-4113-9b15-d345ecc68799"

    CreatedInboundPlan:
      type: object
      description: "A plan Amazon is creating."
      properties:
        inboundPlanId:
          type: string
          nullable: true
          example: "wf47349298-d431-4a8d-99ad-1fe72f5bd0d1"
        operationId:
          type: string
          nullable: true
