          example: "OFFERED"
        expiration:
          type: string
          nullable: true
          description: "When the option expires."
        packingGroups:
          type: array
          description: "Packing group ids of the option."
          items:
            type: string
            example: "pgabd0c44a-5ed1-4f35-b9f5-eb1eabbd28b7"
        fees:
          type: array
          items:
