          type: string
          nullable: true
          example: "2c111bac-d579-4a02-a597-c92a89248f3f"
        availabilityType:
          type: string
          nullable: true
          example: "AVAILABLE"
        startDate:
          type: string
          nullable: true
          example: "2026-11-22T00:00Z"
        endDate:
          type: string
          nullable: true
          example: "2026-11-28T23:59Z"
        validUntil:
          type: string
          nullable: true
          example: "2026-11-15T16:55Z"

    InboundOperationStatus:
      type: object
      properties:
        operationId:
          type: string
          nullable: true
          example: "e18e4319-3c26-4a73-b9e2-45969b8c66f7"
        operation:
          type: string
          nullable: true
          example: "createInboundPlan"
        operationStatus:
          type: string
          nullable: true
          description: "`IN_PROGRESS`, `SUCCESS` or `FAILED`."
          example: "FAILED"
        operationProblems:
          type: array
          items:
            $ref: "#/components/schemas/OperationProblem"

    OperationProblem:
      type: object
      properties:
        code:
          type: string
          nullable: true
          example: "FBA_INB_0180"
        severity:
          type: string
          nullable: true
          description: "`ERROR` or `WARNING`."
          example: "ERROR"
        message:
          type: string
          nullable: true
          example: "ERROR: Expiration date required"
        details:
          type: string
          nullable: true
          example: "There's an input error with the resource 'X8LPVfba'."

    # ---------------------------------------------------------------- common

    ErrorResult:
      type: object
      description: "Represents an error response, including detailed error messages."
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    Message:
      type: object
      description: "Details about an error or informational message."
      properties:
        level:
          type: string
          description: "The severity level of the message."
          enum: [emergency, alert, critical, error, warning, notice, info, debug]
        type:
          type: string
          description: "The type of message. Defaults to LOGGER_MESSAGE if not specified."
          enum: [UNDEFINED, LOGGER_MESSAGE]
        text:
          type: string
          description: "A detailed description of the message."

    SuccessResult:
      allOf:
        - $ref: "#/components/schemas/ErrorResult"
      type: object
      description: "Represents a successful response, optionally including additional data."
      required:
        - data
      properties:
        data:
          type: object
          description: "Response-specific data."
