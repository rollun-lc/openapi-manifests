        labelOwnerConstraint:
          type: string
          nullable: true
          description: "`AMAZON_ONLY`, `NONE_ONLY` or `SELLER_ONLY`; null when anyone may label."
          example: "SELLER_ONLY"
        allOwnersConstraint:
          type: string
          nullable: true
          description: "`MUST_MATCH`: the prep owner and the label owner must be the same."
          example: "MUST_MATCH"

